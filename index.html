    <script>
        window.sfx = {};
        window.initAudio = function() {
            if(window.audioCtx) return;
            window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const ctx = window.audioCtx;
            window.sfx.playShoot = () => { if(ctx.state === 'suspended') ctx.resume(); const bS = ctx.sampleRate * 0.1; const b = ctx.createBuffer(1, bS, ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < bS; i++) d[i] = Math.random() * 2 - 1; const n = ctx.createBufferSource(); n.buffer = b; const nf = ctx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 1000; const g = ctx.createGain(); g.gain.setValueAtTime(0.5, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); n.connect(nf); nf.connect(g); g.connect(ctx.destination); n.start(); };
            window.sfx.playHeadshot = () => { if(ctx.state === 'suspended') ctx.resume(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(1200, ctx.currentTime); g.gain.setValueAtTime(1, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.3); };
            window.sfx.playHit = () => { if(ctx.state === 'suspended') ctx.resume(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(300, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.1); g.gain.setValueAtTime(0.5, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.1); };
            window.sfx.playDamage = () => { if(ctx.state === 'suspended') ctx.resume(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(100, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 0.3); g.gain.setValueAtTime(0.8, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.3); };
            window.sfx.playReload = () => { if(ctx.state === 'suspended') ctx.resume(); const pC = (tO) => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'square'; o.frequency.setValueAtTime(800, ctx.currentTime + tO); g.gain.setValueAtTime(0.2, ctx.currentTime + tO); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + tO + 0.05); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + tO); o.stop(ctx.currentTime + tO + 0.05); }; pC(0); pC(0.4); pC(1.2); };
            window.sfx.playGloo = () => { if(ctx.state === 'suspended') ctx.resume(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(300, ctx.currentTime); o.frequency.linearRampToValueAtTime(900, ctx.currentTime + 0.3); g.gain.setValueAtTime(0.5, ctx.currentTime); g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.4); };
            window.sfx.playHeal = () => { if(ctx.state === 'suspended') ctx.resume(); const n = [440, 554.37, 659.25, 880]; n.forEach((f, i) => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f, ctx.currentTime + i * 0.1); g.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.1); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.3); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + i * 0.1); o.stop(ctx.currentTime + i * 0.1 + 0.3); }); };
        };

        const goFullscreen = () => {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen().catch(e=>console.log(e));
            else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();
            if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(e => console.log(e)); }
        };

        document.getElementById('btn-fs').addEventListener('click', () => {
            goFullscreen(); window.initAudio();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('lobby-ui').style.display = 'block';
        });
        document.getElementById('btn-resume').addEventListener('click', () => {
            goFullscreen(); if(window.audioCtx && window.audioCtx.state === 'suspended') window.audioCtx.resume();
            document.getElementById('resume-screen').style.display = 'none';
        });

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                if (document.getElementById('start-screen').style.display === 'none' && !document.fullscreenElement) {
                    document.getElementById('resume-screen').style.display = 'flex';
                }
            }
        });
    </script>

        function disposeObject(obj) {
            if(obj.geometry) obj.geometry.dispose();
            if(obj.material) {
                if(Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                else obj.material.dispose();

        function createProceduralWeapon() {
            const gunGroup = new THREE.Group();
            const darkMetal = new THREE.MeshStandardMaterial({color: 0x111111, roughness: 0.6, metalness: 0.8});
            const lightMetal = new THREE.MeshStandardMaterial({color: 0x555555, roughness: 0.4, metalness: 0.9});
            const accent = new THREE.MeshStandardMaterial({color: 0x00aaff, emissive: 0x003366});

            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.8, 12), lightMetal);
            barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.05, -0.8);
            
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.4, 0.2), darkMetal);
            mag.position.set(0, -0.3, -0.1); mag.rotation.x = Math.PI / 8;

        // 🟢 الدالة الجديدة المسؤولة عن جلب الـ IP الآمن
        async function getSafeIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return 'ip_' + data.ip.replace(/\./g, '_').replace(/:/g, '_');
            } catch(e) {
                let fallback = localStorage.getItem('profps_fallback_ip');
                if(!fallback) { 
                    fallback = 'ip_fallback_' + Math.floor(Math.random()*1000000); 
                    localStorage.setItem('profps_fallback_ip', fallback); 
                }
                return fallback;
            }
        }

            onChildAdded(myInvitesRef, (snap) => {

            createMyOwnRoom();

            // 🟢 تحديث الاسم الجديد ليكون مرتبطاً بالـ IP دائماً

            detachRoomListeners(); 
            currentRoomId = myId;

        function joinRoom(roomId) {
            detachRoomListeners(); 
            set(myPlayerRef, null); 
            
            currentRoomId = roomId;
            isHost = false;
            document.getElementById('mode-select').disabled = true; 
            document.getElementById('btn-start').style.display = 'none';
            
            setupRefs(currentRoomId);

            setupRoomListeners();

        window.invitePlayer = function(targetId) {
            push(ref(db, 'invites/' + targetId), {
                senderId: myId,
                senderName: myProfile.name,
                roomId: currentRoomId
            });
            const btn = event.target;

        function setupRefs(roomId) {
            roomRef = ref(db, 'rooms/' + roomId);
            playersRef = ref(db, 'rooms/' + roomId + '/players');
            myPlayerRef = ref(db, 'rooms/' + roomId + '/players/' + myId);
            actionsRef = ref(db, 'rooms/' + roomId + '/actions');
            stateRef = ref(db, 'rooms/' + roomId + '/state');
        }

        function detachRoomListeners() {
            if(playersRef) off(playersRef);
            if(stateRef) off(stateRef);
            if(actionsRef) off(actionsRef);
            
            for(let id in playersData) {
                if(id !== myId && playersData[id].mesh) {
                    playersData[id].mesh.traverse(c => { if(c.isMesh) disposeObject(c); });
                    scene.remove(playersData[id].mesh);
                }
            }
            playersData = {};
        }

        function setupRoomListeners() {
            onValue(playersRef, (snap) => {
                let data = snap.val() || {};
                
                for(let id in data) {
                    if(id === myId && id !== 'bot') { myTeam = data[id].team; continue; }
                    
                    if(!playersData[id]) {
                        playersData[id] = { hp: data[id].hp, mesh: create3DCharacter(data[id].profile), lastShot: 0, hasInitPos: false };
                        if(scene) scene.add(playersData[id].mesh);
                    }
                    
                    playersData[id].team = data[id].team;
                    playersData[id].hp = data[id].hp;
                    playersData[id].profile = data[id].profile;
                    applyProfileToMesh(playersData[id].mesh, data[id].profile);

                    if (data[id].pos && playersData[id].mesh) {
                        playersData[id].targetPos = new THREE.Vector3(data[id].pos.x, data[id].pos.y, data[id].pos.z);
                        playersData[id].targetRot = data[id].rot;
                        
                        if(!playersData[id].hasInitPos) {
                            playersData[id].mesh.position.copy(playersData[id].targetPos);
                            playersData[id].mesh.rotation.y = playersData[id].targetRot;
                            playersData[id].hasInitPos = true;
                        }
                    }
                }
                
                for(let id in playersData) {
                    if(id !== 'bot' && !data[id] && id !== myId) {
                        playersData[id].mesh.traverse(c => { if(c.isMesh) disposeObject(c); });
                        scene.remove(playersData[id].mesh);
                        delete playersData[id];
                    }
                }
                updateLobbyUI();
            });

            onValue(stateRef, (snap) => {
                let state = snap.val();
                if(!state) return;

                if (state.type === 'START_ROUND' && !isHost) {
                    gameMode = state.mode; teamScoreA = state.scoreA; teamScoreB = state.scoreB; currentRound = state.round;
                    buildMap(state.map, state.themeIdx); 
                    let index = Object.keys(playersData).indexOf(myId); if(index === -1) index = 1;
                    switchToGameScene(index, state.themeIdx);
                }
                else if (state.type === 'ROUND_OVER') {
                    handleRoundOver(state.winnerTeam, state.scoreA, state.scoreB, state.matchOver);
                }
                else if (state.type === 'BACK_TO_LOBBY') {
                    returnToLobby();
                }
            });

            onChildAdded(actionsRef, (snap) => {
                let action = snap.val();
                if(!action || action.sender === myId) return; 

                if (action.type === 'BULLET_FIRED') {
                    drawBullet(action.start, action.end);
                    if(window.sfx && window.sfx.playShoot) window.sfx.playShoot(); 
                    if(playersData[action.sender]) playersData[action.sender].lastShot = performance.now(); 
                }
                else if (action.type === 'GLOO_WALL') {
                    placeGlooWallLocally(new THREE.Vector3(action.pos.x, action.pos.y, action.pos.z), action.rot);
                    if(window.sfx && window.sfx.playGloo) window.sfx.playGloo(); 
                }
                else if (action.type === 'HIT') {
                    if (action.victim === myId && myHp > 0) {
                        myHp -= action.damage; 
                        if(myHp < 0) myHp = 0; 
                        updateHUD();
                        if(window.sfx && window.sfx.playDamage) window.sfx.playDamage();
                        update(myPlayerRef, { hp: myHp });

                        if (myHp === 0) {
                            push(actionsRef, { type: 'DEATH', killer: action.sender, victim: myId, hs: action.hs });
                            handleDeath();
                        }
                    }
                }
                else if (action.type === 'DEATH') {
                    let kName = action.killer === 'bot' ? 'روبوت' : (playersData[action.killer]?.profile?.name || 'مجهول');
                    if(action.killer === myId) kName = myProfile.name;
                    let vName = action.victim === myId ? myProfile.name : (playersData[action.victim]?.profile?.name || 'مجهول');
                    
                    addKillFeedMsg(kName, vName, action.hs);

                    if (isHost && isPlaying) {
                        let deadTeam = action.victim === myId ? myTeam : playersData[action.victim]?.team;
                        if(deadTeam === 'A') aliveA--; else aliveB--;
                        checkRoundEnd();
                    }
                }
            });
        }

            if(playersData[id]) { 
                let newTeam = playersData[id].team === 'A' ? 'B' : 'A';
                update(ref(db, 'rooms/' + currentRoomId + '/players/' + id), { team: newTeam });

        function organizeLobbyPositions() {
            if(myLobbyMesh) { myLobbyMesh.position.set(0, 0, -15); myLobbyMesh.rotation.y = 0; }
            let offset = 4, side = 1;
            for(let id in playersData) {
                if(id === 'bot' || !playersData[id].mesh) continue;
                playersData[id].mesh.position.set(offset * side, 0, -15); playersData[id].mesh.rotation.y = 0;
                side = (side === 1) ? -1 : 1; if(side === 1) offset += 4;
            }
        }

        function startNextRound() {
            if(!isHost) return;
            update(myGlobalRef, { status: 'in-game' });
            
            set(actionsRef, null);
            
            const themeIdx = Math.floor(Math.random() * mapThemes.length);
            const mapArr = generateAdvancedMap(); buildMap(mapArr, themeIdx);
            
            aliveA = 0; aliveB = 0;
            if(gameMode === 'bot') {
                aliveA = 1; aliveB = 1; 
                update(ref(db, 'rooms/' + currentRoomId + '/players/bot'), { team: 'B', hp: MAX_HP, profile: {name: 'روبوت'}, pos: {x:50, y:0, z:50}, rot: 0, isMoving: false });
            } else {
                if(myTeam === 'A') aliveA++; else aliveB++;
                for(let id in playersData) { 
                    if(id === 'bot') continue;
                    if(playersData[id].team === 'A') aliveA++; else aliveB++; 
                }
            }

            switchToGameScene(0, themeIdx); 
            set(stateRef, { type: 'START_ROUND', mode: gameMode, map: mapArr, round: currentRound, scoreA: teamScoreA, scoreB: teamScoreB, themeIdx: themeIdx });
        }

        function generateAdvancedMap() {
            const arr = [];
            for (let x = -7; x <= 7; x++) {
                for (let z = -7; z <= 7; z++) {
                    if (Math.abs(x) > 5 && Math.abs(z) > 5) continue; 
                    if (Math.abs(x) < 2 && Math.abs(z) < 2) continue; 
                    if (Math.random() > 0.65) {
                        const h = 10 + Math.random() * 20; const objType = Math.floor(Math.random() * 2); 
                        arr.push({ x: x * 10, z: z * 10, h: h, objType: objType });
                    }
                }
            } return arr;
        }

        function buildMap(serverWalls, themeIdx) {
            walls.forEach(w => {
                w.traverse(c => { if(c.isMesh) disposeObject(c); });
                scene.remove(w);
            });
            walls = [];
            
            currentMapObjects.traverse(c => { if(c.isMesh) disposeObject(c); });
            scene.remove(currentMapObjects); 
            currentMapObjects = new THREE.Group();
            
            const theme = mapThemes[themeIdx];
            const solidFloor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: theme.floor }));
            solidFloor.rotation.x = -Math.PI / 2; currentMapObjects.add(solidFloor);

            const bMat = new THREE.MeshLambertMaterial({ color: theme.border || theme.wall || theme.trunk || 0x222222 });
            const addB = (x, z, r, w, d) => {
                const geo = new THREE.BoxGeometry(w, 40, d); const m = new THREE.Mesh(geo, bMat);
                m.position.set(x, 20, z); m.rotation.y = r; currentMapObjects.add(m); walls.push(m);
            };
            addB(0, -80, 0, 160, 10); addB(0, 80, 0, 160, 10); addB(-80, 0, Math.PI/2, 160, 10); addB(80, 0, Math.PI/2, 160, 10);

            serverWalls.forEach(obj => {
                let mesh;
                if (theme.type === 'forest' || theme.type === 'sakura' || theme.type === 'autumn') {
                    if (obj.objType === 0) { 
                        mesh = new THREE.Group();

        function checkRoundEnd() {

            if (aliveA <= 0 || aliveB <= 0) {
                let winnerTeam = aliveA > 0 ? 'A' : 'B';
                if (winnerTeam === 'A') teamScoreA++; else teamScoreB++;
                let matchOver = (teamScoreA >= 4 || teamScoreB >= 4);
                set(stateRef, { type: 'ROUND_OVER', winnerTeam: winnerTeam, scoreA: teamScoreA, scoreB: teamScoreB, matchOver: matchOver });
            }
        }

            const msg = document.getElementById('msg-overlay');

        function placeGlooWallLocally(pos, rot) {
            if(window.sfx && window.sfx.playGloo) window.sfx.playGloo();
            const geo = new THREE.BoxGeometry(10, 10, 2);
            const mat = new THREE.MeshBasicMaterial({ color: 0x55ffff, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
            const gloo = new THREE.Mesh(geo, mat);
            gloo.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff })));
            gloo.position.copy(pos); gloo.rotation.y = rot;
            currentMapObjects.add(gloo); walls.push(gloo);
            
            setTimeout(() => {
                if(currentMapObjects.children.includes(gloo)) {
                    gloo.traverse(c => { if(c.isMesh) disposeObject(c); });
                    currentMapObjects.remove(gloo);
                    const index = walls.indexOf(gloo);
                    if (index > -1) walls.splice(index, 1);
                }

        function reloadWeapon() {
            if (isReloading || myAmmo === MAX_AMMO || myHp <= 0) return;
            isReloading = true; updateWeaponUI();
            if(window.sfx && window.sfx.playReload) window.sfx.playReload();
            gunMesh.rotation.x = -Math.PI / 8; 
            setTimeout(() => {
                myAmmo = MAX_AMMO; isReloading = false;
                if(gunMesh) gunMesh.rotation.x = 0; updateWeaponUI();
            }, 1500);

        function shoot() {
            if(!isPlaying || myHp <= 0 || isReloading) return; 
            if(myAmmo <= 0) { reloadWeapon(); return; }
            
            myAmmo--; updateWeaponUI();
            if(window.sfx && window.sfx.playShoot) window.sfx.playShoot();

            const muzzle = camera.getObjectByName("muzzle");
            const startPos = new THREE.Vector3(); muzzle.getWorldPosition(startPos);
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            let endPos = new THREE.Vector3();
            
            let targets = [...walls];
            for(let id in playersData) {
                if(gameMode === 'bot' && id !== 'bot') continue;
                if(gameMode !== 'bot' && id === 'bot') continue;
                if(gameMode === 'group' && playersData[id].team === myTeam) continue; 
                if(playersData[id].mesh && playersData[id].mesh.visible) targets.push(...playersData[id].mesh.children);
            }

            const intersects = raycaster.intersectObjects(targets, true); 
            let hitPlayerId = null; let dmgAmount = 5; let isHeadshot = false;

            if (intersects.length > 0) {
                endPos.copy(intersects[0].point);
                let hitMesh = intersects[0].object;

                for(let id in playersData) {
                    if(!playersData[id].mesh) continue;
                    let hitBelongsToThis = false;
                    
                    playersData[id].mesh.traverse(c => { 
                        if(c === hitMesh) hitBelongsToThis = true; 
                    });
                    
                    if(hitBelongsToThis) {
                        hitPlayerId = id;
                        
                        let hitHeight = endPos.y - playersData[id].mesh.position.y;
                        
                        if (hitHeight > 4.5) { 
                            dmgAmount = 90; 
                            isHeadshot = true; 
                        } else { 
                            dmgAmount = 15; 
                            isHeadshot = false; 
                        }

                        const origColor = hitMesh.material?.color?.getHex();
                        if (hitMesh.material && hitMesh.material.color) hitMesh.material.color.setHex(0xff0000);
                        
                        if(window.sfx) {
                            if(isHeadshot) window.sfx.playHeadshot();
                            else window.sfx.playHit();
                        }

                        setTimeout(() => { 
                            if(hitMesh.material && hitMesh.material.color && origColor) 
                                hitMesh.material.color.setHex(origColor); 
                        }, 200);
                        
                        showFloatingDamage(dmgAmount, endPos);
                        break;
                    }
                }
            } else raycaster.ray.at(50, endPos);

            drawBullet(startPos, endPos); 

            push(actionsRef, { type: 'BULLET_FIRED', start: {x:startPos.x,y:startPos.y,z:startPos.z}, end: {x:endPos.x,y:endPos.y,z:endPos.z}, sender: myId });
            if(hitPlayerId && hitPlayerId !== 'bot') {
                push(actionsRef, { type: 'HIT', victim: hitPlayerId, damage: dmgAmount, headshot: isHeadshot, sender: myId });
            } 
            else if (hitPlayerId === 'bot' && playersData['bot'].hp > 0) {
                playersData['bot'].hp -= dmgAmount;
                if (playersData['bot'].hp <= 0) {
                    playersData['bot'].hp = 0; 
                    addKillFeedMsg(myProfile.name, 'روبوت', isHeadshot);
                    playersData['bot'].mesh.visible = false; 
                    if(isHost && isPlaying) { aliveB--; checkRoundEnd(); }
                }
            }
        }

        function drawBullet(start, end) {
            const bMat = new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 2 });
            const bGeo = new THREE.BufferGeometry().setFromPoints([start, end]);
            const b = new THREE.Line(bGeo, bMat);
            scene.add(b); 
            setTimeout(() => { 
                disposeObject(b);
                scene.remove(b); 
            }, 40);
        }

        function showFloatingDamage(amount, pos3D) {
            const vec = new THREE.Vector3(pos3D.x, pos3D.y, pos3D.z).project(camera);
            const x = (vec.x * 0.5 + 0.5) * window.innerWidth; const y = (vec.y * -0.5 + 0.5) * window.innerHeight;
            const dmgDiv = document.createElement('div');
            dmgDiv.className = 'dmg-text' + (amount >= 90 ? ' dmg-headshot' : '');
            dmgDiv.innerText = amount >= 90 ? `90` : `-${amount}`;
            dmgDiv.style.left = `${x}px`;
            document.body.appendChild(dmgDiv);
            setTimeout(() => { if(document.body.contains(dmgDiv)) document.body.removeChild(dmgDiv); }, 800);
        }

        function setupControls() {
            const leftZone = document.getElementById('left-touch-zone');
            const rightZone = document.getElementById('right-touch-zone');
            const pad = document.getElementById('joystick-pad');
            const knob = document.getElementById('joystick-knob');

            leftZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (joyTouchId === null) {
                    const t = e.changedTouches[0]; joyTouchId = t.identifier;
                    joyOrigin.x = t.clientX; joyOrigin.y = t.clientY;
                    pad.style.left = t.clientX + 'px'; pad.style.top = t.clientY + 'px';
                    pad.style.display = 'block'; moveX = 0; moveZ = 0;
                }
            });
            leftZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joyTouchId) {
                        const t = e.changedTouches[i];
                        let dx = t.clientX - joyOrigin.x; let dy = t.clientY - joyOrigin.y;
                        const maxR = 40; const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
                        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                        moveX = dx / maxR; moveZ = dy / maxR; 
                    }
                }
            });
            const resetJoy = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joyTouchId) {
                        joyTouchId = null; pad.style.display = 'none';
                        knob.style.transform = `translate(-50%, -50%)`; moveX = 0; moveZ = 0;
                    }
                }
            };
            leftZone.addEventListener('touchend', resetJoy); leftZone.addEventListener('touchcancel', resetJoy);

            rightZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (lookTouchId === null) { 
                    isAiming = true;
                    lookTouchId = e.changedTouches[0].identifier; lastLookX = e.changedTouches[0].clientX; lastLookY = e.changedTouches[0].clientY; 
                }
            });
            rightZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === lookTouchId) {
                        const t = e.changedTouches[i];
                        yaw -= (t.clientX - lastLookX) * 0.005; pitch -= (t.clientY - lastLookY) * 0.005;
                        pitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, pitch)); 
                        camera.rotation.set(pitch, yaw, 0); lastLookX = t.clientX; lastLookY = t.clientY;
                    }
                }
            });
            rightZone.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) { 
                    if (e.changedTouches[i].identifier === lookTouchId) { lookTouchId = null; isAiming = false; }
                }
            });

            document.getElementById('btn-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
            document.getElementById('weapon-ui').addEventListener('touchstart', (e) => { e.preventDefault(); reloadWeapon(); });
            
            document.getElementById('btn-gloo').addEventListener('touchstart', (e) => {
                e.preventDefault(); 
                if (!isPlaying || myHp <= 0 || glooCount <= 0 || isGlooReloading) return;
                
                glooCount--;
                updateGlooUI();

                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); dir.y = 0; dir.normalize();
                const pos = camera.position.clone().add(dir.multiplyScalar(8)); pos.y = 4; 
                
                placeGlooWallLocally(pos, yaw);
                push(actionsRef, { type: 'GLOO_WALL', pos: {x: pos.x, y: pos.y, z: pos.z}, rot: yaw, sender: myId });

                if (glooCount === 0) {
                    isGlooReloading = true;
                    updateGlooUI();
                    setTimeout(() => {
                        glooCount = MAX_GLOO;
                        isGlooReloading = false;
                        updateGlooUI();
                        if(window.sfx && window.sfx.playReload) window.sfx.playReload();
                    }, 10000);
                }
            });

            document.getElementById('btn-heal').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isPlaying && myHp > 0 && myHp < MAX_HP && moveX === 0 && moveZ === 0) {
                    isHealing = true; healTime = 0; document.getElementById('heal-progress-container').style.display = 'block';
                }
            });
        }

        function updateMinimap() {
            if (!isPlaying) return;
            const canvas = document.getElementById('minimap');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 120, 120);

            ctx.fillStyle = '#00ff00'; ctx.beginPath(); ctx.arc(60, 60, 4, 0, Math.PI*2); ctx.fill();
            
            const dirX = -Math.sin(yaw) * 8; const dirZ = -Math.cos(yaw) * 8;
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(60, 60); ctx.lineTo(60 + dirX, 60 + dirZ); ctx.stroke();

            for(let id in playersData) {
                const p = playersData[id];
                if (!p.mesh || !p.mesh.visible || p.hp <= 0) continue;
                let isEnemy = (gameMode === 'group' && p.team !== myTeam) || (gameMode !== 'group');
                if (isEnemy && (performance.now() - p.lastShot > 2000)) continue;

                const dx = p.mesh.position.x - camera.position.x; const dz = p.mesh.position.z - camera.position.z;
                const mx = 60 + (dx * 0.6); const mz = 60 + (dz * 0.6);
                
                if (mx > 5 && mx < 115 && mz > 5 && mz < 115) {
                    ctx.fillStyle = isEnemy ? '#ff0000' : '#00aaff';
                    ctx.beginPath(); ctx.arc(mx, mz, 3, 0, Math.PI*2); ctx.fill();
                }
            }
        }

        function animateCharacter(mesh, isMoving, time) {
            if(!mesh) return;
            const tag = mesh.getObjectByName("nameTag");
            if (tag) { tag.visible = inLobby; tag.quaternion.copy(camera.quaternion); }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now(); const delta = Math.min((time - prevTime) / 1000, 0.1); prevTime = time;

            if (isPlaying && myHp > 0) {
                
                if (isHealing) {
                    if (moveX !== 0 || moveZ !== 0) {
                        isHealing = false; document.getElementById('heal-progress-container').style.display = 'none'; showFloatingDamage('إلغاء', camera.position);
                    } else {
                        healTime += delta; document.getElementById('heal-progress-fill').style.width = (healTime / HEAL_DURATION) * 100 + '%';
                        if (healTime >= HEAL_DURATION) {
                            isHealing = false; document.getElementById('heal-progress-container').style.display = 'none';
                            myHp = Math.min(MAX_HP, myHp + 75); updateHUD(); showFloatingDamage('+75', camera.position);
                            update(myPlayerRef, { hp: myHp }); 
                            if(window.sfx && window.sfx.playHeal) window.sfx.playHeal();
                        }
                    }
                }

                let isMoving = false;
                if (moveX !== 0 || moveZ !== 0) {
                    isMoving = true;
                    const moveSpeed = 16 * delta; 
                    
                    const fwd = new THREE.Vector3(0, 0, moveZ); 
                    const right = new THREE.Vector3(moveX, 0, 0); 
                    const dir = new THREE.Vector3().addVectors(fwd, right);
                    dir.applyQuaternion(camera.quaternion); dir.y = 0;
                    
                    if (dir.lengthSq() > 0) {
                        dir.normalize();
                        const speedMulti = Math.min(1, Math.sqrt(moveX*moveX + moveZ*moveZ));

                        const dirX = new THREE.Vector3(dir.x, 0, 0).normalize();
                        const backOffX = new THREE.Vector3(-dirX.x, 0, 0).multiplyScalar(1.5);
                        if (new THREE.Raycaster(camera.position.clone().add(backOffX), dirX, 0, 3.5).intersectObjects(walls, true).length === 0) {
                            camera.position.x += dir.x * moveSpeed * speedMulti;
                        }
                            
                        const dirZ = new THREE.Vector3(0, 0, dir.z).normalize();
                        const backOffZ = new THREE.Vector3(0, 0, -dirZ.z).multiplyScalar(1.5);
                        if (new THREE.Raycaster(camera.position.clone().add(backOffZ), dirZ, 0, 3.5).intersectObjects(walls, true).length === 0) {
                            camera.position.z += dir.z * moveSpeed * speedMulti;
                        }
                    }
                }

                if (isAiming) {
                    let bestEnemyPos = null;
                    let minAngle = 0.12; 
                    let camDir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
                    
                    let checkTargets = [];
                    if (gameMode === 'bot' && playersData['bot'] && playersData['bot'].hp > 0 && playersData['bot'].mesh && playersData['bot'].mesh.visible) {
                        checkTargets.push(playersData['bot'].mesh.position.clone().setY(5));
                    } else if (gameMode !== 'bot') {
                        for(let id in playersData) {
                            if(id === 'bot' || id === myId) continue;
                            let p = playersData[id];
                            if(p.hp > 0 && p.mesh && p.mesh.visible && (gameMode !== 'group' || p.team !== myTeam)) {
                                checkTargets.push(p.mesh.position.clone().setY(5));
                            }
                        }
                    }

                    for(let targetPos of checkTargets) {
                        let dirToEnemy = targetPos.clone().sub(camera.position).normalize();
                        let angle = camDir.angleTo(dirToEnemy);
                        if (angle < minAngle) {
                            let sightRay = new THREE.Raycaster(camera.position, dirToEnemy, 0, camera.position.distanceTo(targetPos));
                            if(sightRay.intersectObjects(walls, true).length === 0) {
                                minAngle = angle;
                                bestEnemyPos = targetPos;
                            }
                        }
                    }

                    if (bestEnemyPos) {
                        let dummyCam = camera.clone(); dummyCam.lookAt(bestEnemyPos); let targetEuler = dummyCam.rotation;
                        let diffYaw = targetEuler.y - yaw;
                        while(diffYaw < -Math.PI) diffYaw += Math.PI*2; while(diffYaw > Math.PI) diffYaw -= Math.PI*2;
                        yaw += diffYaw * 0.08; 
                        
                        let diffPitch = targetEuler.x - pitch; pitch += diffPitch * 0.08; pitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, pitch));
                        camera.rotation.set(pitch, yaw, 0);
                    }
                }

                if (time - lastNetworkUpdate > 50) {
                    update(myPlayerRef, { pos: { x: camera.position.x, y: 0, z: camera.position.z }, rot: yaw, isMoving: isMoving });
                    lastNetworkUpdate = time;
                }

                if (gameMode === 'bot' && isHost && playersData['bot'] && playersData['bot'].hp > 0 && playersData['bot'].mesh) {
                    const bot = playersData['bot']; const botPos = bot.mesh.position; const headPos = botPos.clone().setY(6);
                    const distToPlayer = headPos.distanceTo(camera.position); const dirToPlayer = camera.position.clone().sub(headPos).normalize();
                    
                    if (new THREE.Raycaster(headPos, dirToPlayer, 0, distToPlayer).intersectObjects(walls, true).length === 0 && distToPlayer < 70) {
                        bot.mesh.lookAt(camera.position.x, botPos.y, camera.position.z);
                        
                        if(!bot.strafeDir) bot.strafeDir = 1;
                        if(Math.random() < 0.03) bot.strafeDir *= -1; 
                        
                        const fwdV = dirToPlayer.clone().setY(0).normalize();
                        const rightV = new THREE.Vector3(-fwdV.z, 0, fwdV.x).multiplyScalar(bot.strafeDir * 0.8);
                        let moveDir = new THREE.Vector3();
                        
                        if (distToPlayer > 20) moveDir.add(fwdV); 
                        else if (distToPlayer < 10) moveDir.sub(fwdV); 
                        moveDir.add(rightV).normalize(); 
                        
                        let isBotMoving = false;
                        if (new THREE.Raycaster(headPos, moveDir, 0, 3).intersectObjects(walls, true).length === 0) {
                            botPos.add(moveDir.multiplyScalar(14 * delta)); 
                            isBotMoving = true;
                        }
                        
                        if(time - bot.lastMoveUpdate > 50 || !bot.lastMoveUpdate) {
                            update(ref(db, 'rooms/' + currentRoomId + '/players/bot'), { pos: {x: botPos.x, y: botPos.y, z: botPos.z}, rot: bot.mesh.rotation.y, isMoving: isBotMoving });
                            bot.lastMoveUpdate = time;
                        }

                        if (!bot.lastShoot || time - bot.lastShoot > 600) { 
                            bot.lastShoot = time; 
                            push(actionsRef, { type: 'BULLET_FIRED', start: {x:botPos.x, y:4, z:botPos.z}, end: {x:camera.position.x, y:camera.position.y, z:camera.position.z}, sender: 'bot' });
                            push(actionsRef, { type: 'HIT', victim: myId, damage: 15, headshot: false, sender: 'bot' });
                        }
                    }
                }
                
                updateMinimap();

            } else if (inLobby) {
                camera.position.set(0, 5, -3); camera.lookAt(0, 4, -15);
                if(myLobbyMesh) animateCharacter(myLobbyMesh, false, time);
            }

            for(let id in playersData) { 
                if (id !== myId && playersData[id].mesh && playersData[id].targetPos) {
                    playersData[id].mesh.position.lerp(playersData[id].targetPos, 0.15);
                    
                    let diffYaw = playersData[id].targetRot - playersData[id].mesh.rotation.y;
                    while(diffYaw < -Math.PI) diffYaw += Math.PI*2; 
                    while(diffYaw > Math.PI) diffYaw -= Math.PI*2;
                    playersData[id].mesh.rotation.y += diffYaw * 0.15;
                }
                if (playersData[id].mesh && id !== 'bot') {
                    animateCharacter(playersData[id].mesh, false, time);
                }
            }

            renderer.render(scene, camera);
        }

        // 🟢 التسلسل الآمن: تشغيل الـ 3D فوراً، ثم تهيئة الشبكة
        init3D();
        initFirebaseNetwork();
    </script>
</body>
