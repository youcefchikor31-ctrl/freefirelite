        .team-btn { font-size: 10px; padding: 3px 6px; border: none; border-radius: 3px; cursor: pointer; color: white;}

        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none;}
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #ffffff; border-radius: 50%; transform: translate(-50%, -50%); }
        
        #top-status { position: absolute; top: 2vh; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 1vh 2vw; border: 2px solid #fff; border-radius: 10px; color: white; font-size: min(16px, 3vh); font-weight: bold; text-shadow: 0 0 5px #000; z-index: 10; pointer-events: none; display: flex; gap: 2vw; }

        #heal-progress-container { display: none; position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); width: 25vw; max-width: 200px; height: 2vh; background: rgba(0,0,0,0.7); border: 1px solid #00ff00; border-radius: 8px; overflow: hidden; z-index: 20; }

        #joystick-pad { position: absolute; width: min(120px, 20vw); height: min(120px, 20vw); border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); display: none; transform: translate(-50%, -50%); z-index: 5; pointer-events: none;}
        #joystick-knob { position: absolute; width: min(40px, 7vw); height: min(40px, 7vw); border-radius: 50%; background: rgba(255,255,255,0.7); top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px #fff;}

        #minimap { position: absolute; top: 2vh; left: 2vw; width: min(120px, 15vw); height: min(120px, 15vw); background: rgba(0, 0, 0, 0.6); border: 2px solid #00aaff; border-radius: 10px; z-index: 10; pointer-events: none; }

        #weapon-ui { position: absolute; bottom: 18vh; right: 2vw; background: rgba(0,0,0,0.7); border: 2px solid #ffaa00; padding: 1vh; border-radius: 10px; color: white; text-align: center; font-weight: bold; z-index: 15; pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; width: max(60px, 8vw);}

        .btn-game:active { background: rgba(255, 255, 255, 0.4); }
        
        #btn-shoot { bottom: 5vh; right: 5vw; width: min(80px, 15vw); height: min(80px, 15vw); background: rgba(255, 170, 0, 0.2); border-color: #ffaa00; font-size: min(20px, 4vh);}
        #btn-gloo { bottom: 5vh; right: calc(5vw + min(90px, 17vw)); width: min(60px, 11vw); height: min(60px, 11vw); background: rgba(0, 255, 255, 0.2); border-color: #00ffff; }
        #btn-heal { bottom: 5vh; right: calc(5vw + min(160px, 30vw)); width: min(60px, 11vw); height: min(60px, 11vw); background: rgba(0, 255, 0, 0.2); border-color: #00ff00; }

        .dmg-text { position: absolute; font-weight: bold; text-shadow: 2px 2px 0 #000; pointer-events: none; animation: floatUp 0.8s forwards; z-index: 50; }

        @keyframes fadeOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; display: none; } }

    <script>
        window.sfx = {};
        window.initAudio = function() {
            if(window.audioCtx) return;
            window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const ctx = window.audioCtx;
            window.sfx.playShoot = () => { if(ctx.state === 'suspended') ctx.resume(); const bS = ctx.sampleRate * 0.1; const b = ctx.createBuffer(1, bS, ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < bS; i++) d[i] = Math.random() * 2 - 1; const n = ctx.createBufferSource(); n.buffer = b; const nf = ctx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 1000; const g = ctx.createGain(); g.gain.setValueAtTime(0.5, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); n.connect(nf); nf.connect(g); g.connect(ctx.destination); n.start(); };
            window.sfx.playHeadshot = () => { if(ctx.state === 'suspended') ctx.resume(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(1200, ctx.currentTime); g.gain.setValueAtTime(1, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.3); };
            window.sfx.playHit = () => { if(ctx.state === 'suspended') ctx.resume(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(300, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.1); g.gain.setValueAtTime(0.5, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.1); };
            window.sfx.playDamage = () => { if(ctx.state === 'suspended') ctx.resume(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(100, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 0.3); g.gain.setValueAtTime(0.8, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.3); };
            window.sfx.playReload = () => { if(ctx.state === 'suspended') ctx.resume(); const pC = (tO) => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'square'; o.frequency.setValueAtTime(800, ctx.currentTime + tO); g.gain.setValueAtTime(0.2, ctx.currentTime + tO); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + tO + 0.05); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + tO); o.stop(ctx.currentTime + tO + 0.05); }; pC(0); pC(0.4); pC(1.2); };
            window.sfx.playGloo = () => { if(ctx.state === 'suspended') ctx.resume(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(300, ctx.currentTime); o.frequency.linearRampToValueAtTime(900, ctx.currentTime + 0.3); g.gain.setValueAtTime(0.5, ctx.currentTime); g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.4); };
            window.sfx.playHeal = () => { if(ctx.state === 'suspended') ctx.resume(); const n = [440, 554.37, 659.25, 880]; n.forEach((f, i) => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f, ctx.currentTime + i * 0.1); g.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.1); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.3); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + i * 0.1); o.stop(ctx.currentTime + i * 0.1 + 0.3); }); };
        };

        const goFullscreen = () => {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen().catch(e=>console.log(e));
            else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();
            if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(e => console.log(e)); }
        };

        document.getElementById('btn-fs').addEventListener('click', () => {
            goFullscreen(); window.initAudio();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('lobby-ui').style.display = 'block';
        });
        document.getElementById('btn-resume').addEventListener('click', () => {
            goFullscreen(); if(window.audioCtx && window.audioCtx.state === 'suspended') window.audioCtx.resume();
            document.getElementById('resume-screen').style.display = 'none';
        });

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                if (document.getElementById('start-screen').style.display === 'none' && !document.fullscreenElement) {
                    document.getElementById('resume-screen').style.display = 'flex';
                }
            }
        });
    </script>

        function initFirebaseNetwork() {

                const players = snap.val() || {};

                    if(id === myId) continue;

            detachRoomListeners();

            set(myPlayerRef, { team: 'A', hp: MAX_HP, profile: myProfile, pos: {x:0, y:0, z:0}, rot: 0, isMoving: false });

        function joinRoom(roomId) {
            detachRoomListeners(); 
            set(myPlayerRef, null); 
            currentRoomId = roomId;
            isHost = false;
            document.getElementById('mode-select').disabled = true; 
            document.getElementById('btn-start').style.display = 'none';
            setupRefs(currentRoomId);

        window.invitePlayer = function(targetId) {

        };

        function setupRefs(roomId) {
            roomRef = ref(db, 'rooms/' + roomId);
            playersRef = ref(db, 'rooms/' + roomId + '/players');
            myPlayerRef = ref(db, 'rooms/' + roomId + '/players/' + myId);
            actionsRef = ref(db, 'rooms/' + roomId + '/actions');
            stateRef = ref(db, 'rooms/' + roomId + '/state');
        }

        function detachRoomListeners() {
            if(playersRef) off(playersRef);
            if(stateRef) off(stateRef);
            if(actionsRef) off(actionsRef);
            for(let id in playersData) {
                if(id !== myId && playersData[id].mesh) scene.remove(playersData[id].mesh);
            }
            playersData = {};
        }

        function setupRoomListeners() {
            onValue(playersRef, (snap) => {
                let data = snap.val() || {};
                for(let id in data) {
                    if(id === myId && id !== 'bot') { myTeam = data[id].team; continue; }
                    
                    if(!playersData[id]) {
                        playersData[id] = { hp: data[id].hp, mesh: createAdvancedCharacter(data[id].profile), lastShot: 0 };
                        if(scene) scene.add(playersData[id].mesh);
                    }
                    
                    playersData[id].team = data[id].team;
                    playersData[id].hp = data[id].hp;
                    playersData[id].profile = data[id].profile;
                    applyProfileToMesh(playersData[id].mesh, data[id].profile);

                    if (data[id].pos && playersData[id].mesh) {
                        playersData[id].mesh.position.set(data[id].pos.x, data[id].pos.y, data[id].pos.z);
                        playersData[id].mesh.rotation.y = data[id].rot;
                        animateCharacter(playersData[id].mesh, data[id].isMoving, performance.now());
                    }
                }
                
                // إخفاء المجسمات للاعبين الموتى
                for(let id in playersData) {
                    if(id !== 'bot' && (!data[id] || data[id].hp <= 0) && id !== myId) {
                        if(playersData[id].mesh) playersData[id].mesh.visible = false;
                    } else if (id !== myId && data[id] && data[id].hp > 0 && playersData[id].mesh) {
                        playersData[id].mesh.visible = true;
                    }
                }
                updateLobbyUI();
            });

            onValue(stateRef, (snap) => {
                let state = snap.val();
                if(!state) return;

                if (state.type === 'START_ROUND' && !isHost) {
                    gameMode = state.mode; teamScoreA = state.scoreA; teamScoreB = state.scoreB; currentRound = state.round;
                    buildMap(state.map, state.themeIdx); 
                    let index = Object.keys(playersData).indexOf(myId); if(index === -1) index = 1;
                    switchToGameScene(index, state.themeIdx);
                }
                else if (state.type === 'ROUND_OVER') {
                    handleRoundOver(state.winnerTeam, state.scoreA, state.scoreB, state.matchOver);
                }
                else if (state.type === 'BACK_TO_LOBBY') {
                    returnToLobby();
                }
            });

            onChildAdded(actionsRef, (snap) => {
                let action = snap.val();
                if(!action || action.sender === myId) return; 

                if (action.type === 'BULLET_FIRED') {
                    drawBullet(action.start, action.end);
                    if(window.sfx && window.sfx.playShoot) window.sfx.playShoot(); 
                    if(playersData[action.sender]) playersData[action.sender].lastShot = performance.now(); 
                }
                else if (action.type === 'GLOO_WALL') {
                    placeGlooWallLocally(new THREE.Vector3(action.pos.x, action.pos.y, action.pos.z), action.rot);
                    if(window.sfx && window.sfx.playGloo) window.sfx.playGloo(); 
                }
                else if (action.type === 'HIT') {
                    if (action.victim === myId && myHp > 0) {
                        myHp -= action.damage; updateHUD();
                        if(window.sfx && window.sfx.playDamage) window.sfx.playDamage();
                        update(myPlayerRef, { hp: myHp });

                        if (myHp <= 0) {
                            push(actionsRef, { type: 'DEATH', killer: action.sender, victim: myId, hs: action.hs });
                            handleDeath();
                        }
                    }
                }
                else if (action.type === 'DEATH') {
                    let kName = action.killer === 'bot' ? 'روبوت' : (playersData[action.killer]?.profile?.name || 'مجهول');
                    if(action.killer === myId) kName = myProfile.name;
                    let vName = action.victim === myId ? myProfile.name : (playersData[action.victim]?.profile?.name || 'مجهول');
                    
                    addKillFeedMsg(kName, vName, action.hs);

                    if (isHost) {
                        let deadTeam = action.victim === myId ? myTeam : playersData[action.victim]?.team;
                        if(deadTeam === 'A') aliveA--; else aliveB--;
                        checkRoundEnd();
                    }
                }
            });
        }

        function createNameSprite(name) {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 10, 256, 44);
            ctx.font = 'bold 30px sans-serif'; ctx.fillStyle = '#ffaa00';
            ctx.textAlign = 'center'; ctx.fillText(name, 128, 42);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
            sprite.scale.set(8, 2, 1); sprite.position.y = -0.5; sprite.name = "nameTag"; return sprite;
        }

        // بناء شخصية احترافية بقطع مسماة لاكتشاف أماكن الضرب بدقة
        function createAdvancedCharacter(profile) {
            const group = new THREE.Group();
            
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xffccaa }); 
            const shirtMat = new THREE.MeshLambertMaterial({ color: profile.shirt || '#0055ff' }); 
            const pantsMat = new THREE.MeshLambertMaterial({ color: profile.pants || '#222222' }); 
            const hairMat = new THREE.MeshLambertMaterial({ color: profile.hair || '#ffaa00' }); 
            
            const createPart = (geo, mat, name, yPos, parentY = 0) => {
                const mesh = new THREE.Mesh(geo, mat.clone()); 
                mesh.name = name; // مهم جداً للـ Hitbox
                mesh.position.y = yPos;
                const pivot = new THREE.Group(); pivot.position.y = parentY; pivot.add(mesh); pivot.name = name + "_pivot";
                group.add(pivot); return pivot;
            };

            // الرأس (90 دمج)
            const headP = createPart(new THREE.BoxGeometry(2, 2, 2), skinMat, "head", 1, 6);
            const hair = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.5, 2.1), hairMat); hair.position.y = 2.2; hair.name = "head"; headP.children[0].add(hair);

            // الصدر (25 دمج)
            createPart(new THREE.BoxGeometry(3, 4, 1.5), shirtMat, "chest", -2, 6);
            
            // الأطراف (10 دمج)
            const armL = createPart(new THREE.BoxGeometry(1, 3.5, 1), skinMat, "limb", -1.5, 5.5); armL.position.x = -2;
            const armR = createPart(new THREE.BoxGeometry(1, 3.5, 1), skinMat, "limb", -1.5, 5.5); armR.position.x = 2;
            
            // إضافة سلاح للشخصية
            const charGun = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 3), new THREE.MeshLambertMaterial({ color: 0x111 }));
            charGun.position.set(0, -1.5, -1); armR.children[0].add(charGun); 

            const legL = createPart(new THREE.BoxGeometry(1.2, 4, 1.2), pantsMat, "limb", -2, 4); legL.position.x = -0.8;
            const legR = createPart(new THREE.BoxGeometry(1.2, 4, 1.2), pantsMat, "limb", -2, 4); legR.position.x = 0.8;

            const nameSprite = createNameSprite(profile.name);
            nameSprite.position.y = 8.5;
            group.add(nameSprite);

            return group;
        }

        function applyProfileToMesh(group, profile) {
            if(!group) return;
            group.getObjectByName("chest").material.color.set(profile.shirt);
            group.children.forEach(c => {
                if(c.name === "limb_pivot" && c.position.y === 4) c.children[0].material.color.set(profile.pants);
            });
            const oldTag = group.getObjectByName("nameTag");
            if(oldTag) group.remove(oldTag); 
            const newTag = createNameSprite(profile.name);
            newTag.position.y = 8.5;
            group.add(newTag);
        }

        // الخرائط التكتيكية الموسعة (الضعف 2x)
        function generateAdvancedMap() {
            const arr = [];
            // توسيع الخريطة (من -14 إلى 14 بدلاً من -7 إلى 7)
            for (let x = -14; x <= 14; x+=2) {
                for (let z = -14; z <= 14; z+=2) {
                    if (Math.abs(x) > 12 && Math.abs(z) > 12) continue; 
                    if (Math.abs(x) < 4 && Math.abs(z) < 4) continue; // منطقة المنتصف فارغة
                    
                    if (Math.random() > 0.85) {
                        const type = Math.floor(Math.random() * 3); // 0: Crate, 1: House, 2: Car
                        arr.push({ x: x * 10, z: z * 10, objType: type });
                    }
                }
            } return arr;
        }

        function buildMap(serverWalls, themeIdx) {
            walls.forEach(w => scene.remove(w)); walls = [];
            scene.remove(currentMapObjects); currentMapObjects = new THREE.Group();
            
            const theme = mapThemes[themeIdx];
            const solidFloor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: theme.floor }));
            solidFloor.rotation.x = -Math.PI / 2; currentMapObjects.add(solidFloor);

            const bMat = new THREE.MeshLambertMaterial({ color: theme.border });
            const addB = (x, z, r, w, d) => {
                const geo = new THREE.BoxGeometry(w, 60, d); const m = new THREE.Mesh(geo, bMat);
                m.position.set(x, 30, z); m.rotation.y = r; currentMapObjects.add(m); walls.push(m);
            };
            // أسوار الخريطة البعيدة
            addB(0, -150, 0, 300, 10); addB(0, 150, 0, 300, 10); addB(-150, 0, Math.PI/2, 300, 10); addB(150, 0, Math.PI/2, 300, 10);

            serverWalls.forEach(obj => {
                let mesh;
                if (obj.objType === 0) { 
                    // صندوق حماية
                    mesh = new THREE.Mesh(new THREE.BoxGeometry(10, 15, 10), new THREE.MeshLambertMaterial({ color: theme.crate })); 
                    mesh.position.set(obj.x, 7.5, obj.z);
                } else if (obj.objType === 1) { 
                    // منزل حربي مع سلالم (منحدر)
                    mesh = new THREE.Group();
                    const mat = new THREE.MeshLambertMaterial({ color: theme.wall });
                    // السقف/الأرضية العلوية
                    const floor2 = new THREE.Mesh(new THREE.BoxGeometry(20, 1, 20), mat); floor2.position.set(0, 12, 0);
                    // جدران النوافذ العلوية
                    const w1 = new THREE.Mesh(new THREE.BoxGeometry(20, 4, 1), mat); w1.position.set(0, 14.5, -9.5);
                    const w2 = new THREE.Mesh(new THREE.BoxGeometry(20, 4, 1), mat); w2.position.set(0, 14.5, 9.5);
                    const w3 = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 20), mat); w3.position.set(-9.5, 14.5, 0);
                    const w4 = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 20), mat); w4.position.set(9.5, 14.5, 0);
                    // المنحدر (الدرج)
                    const ramp = new THREE.Mesh(new THREE.BoxGeometry(10, 1, 30), mat);
                    ramp.position.set(15, 6, 0); ramp.rotation.z = Math.PI / 4;
                    // الأعمدة
                    const p1 = new THREE.Mesh(new THREE.BoxGeometry(2, 12, 2), mat); p1.position.set(-9, 6, -9);
                    const p2 = new THREE.Mesh(new THREE.BoxGeometry(2, 12, 2), mat); p2.position.set(9, 6, -9);
                    const p3 = new THREE.Mesh(new THREE.BoxGeometry(2, 12, 2), mat); p3.position.set(-9, 6, 9);
                    const p4 = new THREE.Mesh(new THREE.BoxGeometry(2, 12, 2), mat); p4.position.set(9, 6, 9);
                    
                    mesh.add(floor2); mesh.add(w1); mesh.add(w2); mesh.add(w3); mesh.add(w4); mesh.add(ramp); mesh.add(p1); mesh.add(p2); mesh.add(p3); mesh.add(p4);
                    mesh.position.set(obj.x, 0, obj.z);
                } else if (obj.objType === 2) {
                    // سيارة مهجورة
                    mesh = new THREE.Group();
                    const carMat = new THREE.MeshLambertMaterial({ color: 0x334455 });
                    const tireMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
                    const base = new THREE.Mesh(new THREE.BoxGeometry(10, 3, 20), carMat); base.position.set(0, 3, 0);
                    const top = new THREE.Mesh(new THREE.BoxGeometry(9, 4, 10), carMat); top.position.set(0, 6.5, -2);
                    
                    for(let i=0; i<4; i++) {
                        const tire = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 2), tireMat);
                        tire.rotation.z = Math.PI / 2;
                        tire.position.set((i%2===0?5:-5), 2, (i<2?6:-6));
                        mesh.add(tire);
                    }
                    mesh.add(base); mesh.add(top);
                    mesh.position.set(obj.x, 0, obj.z);
                }

                if(mesh) { currentMapObjects.add(mesh); walls.push(mesh); }
            });
            scene.add(currentMapObjects);
        }

        function startNextRound() {
            if(!isHost) return;
            update(myGlobalRef, { status: 'in-game' });
            
            const themeIdx = Math.floor(Math.random() * mapThemes.length);
            const mapArr = generateAdvancedMap(); buildMap(mapArr, themeIdx);
            
            aliveA = 0; aliveB = 0;
            if(gameMode === 'bot') {
                aliveA = 1; aliveB = 1; 
                update(ref(db, 'rooms/' + currentRoomId + '/players/bot'), { team: 'B', hp: MAX_HP, profile: {name: 'روبوت'}, pos: {x:80, y:0, z:80}, rot: 0, isMoving: false });
            } else {
                if(myTeam === 'A') aliveA++; else aliveB++;
                for(let id in playersData) { if(playersData[id].team === 'A') aliveA++; else aliveB++; }
            }

            switchToGameScene(0, themeIdx); 
            set(stateRef, { type: 'START_ROUND', mode: gameMode, map: mapArr, round: currentRound, scoreA: teamScoreA, scoreB: teamScoreB, themeIdx: themeIdx });
        }

        function switchToGameScene(spawnIndex, themeIdx) {
            inLobby = false; isPlaying = true;
            document.getElementById('lobby-ui').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            
            const msg = document.getElementById('msg-overlay');
            const theme = mapThemes[themeIdx];
            msg.innerHTML = `الجولة ${currentRound}<br><span style="font-size:18px; color:#fff">خريطة: ${theme.name}</span>`;
            msg.style.display = 'flex';
            setTimeout(() => { if(isPlaying) msg.style.display = 'none'; }, 2000);
            
            myHp = MAX_HP; isHealing = false; myAmmo = MAX_AMMO; isReloading = false; 
            
            glooCount = MAX_GLOO; isGlooReloading = false; updateGlooUI();
            
            updateHUD(); updateWeaponUI();
            
            lobbyEnv.visible = false;
            scene.background = new THREE.Color(theme.bg); scene.fog = new THREE.FogExp2(theme.bg, 0.0025);
            ambientLight.intensity = 0.6; dirLight.intensity = 0.7; 

            gunMesh.visible = true; myLobbyMesh.visible = false; 
            // إعادة تفعيل الكاميرا
            isScoped = false; camera.fov = 70; camera.updateProjectionMatrix();

            for(let id in playersData) { if(playersData[id].mesh) playersData[id].mesh.visible = true; }

            const spawns = [{x: -80, z: -80}, {x: 80, z: 80}, {x: -80, z: 80}, {x: 80, z: -80}];
            const idx = spawnIndex % spawns.length;
            camera.position.set(spawns[idx].x, 8, spawns[idx].z);
            yaw = 0; pitch = 0; camera.rotation.set(0,0,0);
        }

        function checkRoundEnd() {
            if (!isHost) return;
            if (aliveA <= 0 || aliveB <= 0) {
                let winnerTeam = aliveA > 0 ? 'A' : 'B';
                if (winnerTeam === 'A') teamScoreA++; else teamScoreB++;
                let matchOver = (teamScoreA >= 4 || teamScoreB >= 4);
                set(stateRef, { type: 'ROUND_OVER', winnerTeam: winnerTeam, scoreA: teamScoreA, scoreB: teamScoreB, matchOver: matchOver });
            }
        }

        function handleRoundOver(winnerTeam, sA, sB, matchOver) {
            teamScoreA = sA; teamScoreB = sB; updateHUD(); isPlaying = false; 
            const msg = document.getElementById('msg-overlay');
            if (matchOver) {
                let iWon = (myTeam === winnerTeam);
                msg.innerHTML = iWon ? `🏆 فريقك انتصر بالمباراة! 🏆<br><br>العودة للوبي...` : `💀 فريق الخصم انتصر بالمباراة 💀<br><br>العودة للوبي...`;
                msg.style.display = 'flex';
                if(isHost) setTimeout(() => { set(stateRef, { type: 'BACK_TO_LOBBY' }); }, 4000);
            } else {
                let iWon = (myTeam === winnerTeam);
                msg.innerHTML = iWon ? `فريقك فاز بالجولة!` : `الخصم فاز بالجولة!`;
                msg.style.display = 'flex';
                if (isHost) { currentRound++; setTimeout(() => { startNextRound(); }, 3000); }
            }
        }

        function returnToLobby() {
            inLobby = true; isPlaying = false;
            update(myGlobalRef, { status: 'idle' });
            
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('lobby-ui').style.display = 'block';
            document.getElementById('msg-overlay').style.display = 'none';
            
            lobbyEnv.visible = true; scene.remove(currentMapObjects); 
            scene.background = new THREE.Color(0x87CEEB); scene.fog = new THREE.FogExp2(0x87CEEB, 0.0025);
            ambientLight.intensity = 0.6; dirLight.intensity = 0.5; 
            
            gunMesh.visible = false; myLobbyMesh.visible = true;
            isScoped = false; camera.fov = 70; camera.updateProjectionMatrix();

            for(let id in playersData) { if (playersData[id].mesh) playersData[id].mesh.visible = true; }
            organizeLobbyPositions();
        }

        function placeGlooWallLocally(pos, rot) {
            if(window.sfx && window.sfx.playGloo) window.sfx.playGloo();
            const geo = new THREE.BoxGeometry(10, 10, 2);
            const mat = new THREE.MeshBasicMaterial({ color: 0x55ffff, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
            const gloo = new THREE.Mesh(geo, mat);
            gloo.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff })));
            gloo.position.copy(pos); gloo.rotation.y = rot;
            currentMapObjects.add(gloo); walls.push(gloo);
            
            setTimeout(() => {
                currentMapObjects.remove(gloo);
                const index = walls.indexOf(gloo);
                if (index > -1) walls.splice(index, 1);
            }, 15000);
        }

        function updateGlooUI() {
            const btn = document.getElementById('btn-gloo');
            if (isGlooReloading) {
                btn.innerHTML = `🧊<br><small style="color:red;">انتظر</small>`;
                btn.style.opacity = 0.5;
            } else {
                btn.innerHTML = `🧊<br><small>${glooCount}</small>`;
                btn.style.opacity = 1;
            }
        }

        function addKillFeedMsg(killerName, victimName, isHeadshot) {
            const feed = document.getElementById('kill-feed');
            const div = document.createElement('div'); div.className = 'kill-msg';
            div.innerHTML = `<span class="killer">${killerName}</span> 🔫 <span class="victim">${victimName}</span> ${isHeadshot ? '<span class="hs">🎯 (Headshot)</span>' : ''}`;
            feed.appendChild(div); setTimeout(() => { if(feed.contains(div)) feed.removeChild(div); }, 4000);
        }

        function updateWeaponUI() {
            document.getElementById('weapon-ammo').innerText = isReloading ? "جارٍ..." : `${myAmmo}/${MAX_AMMO}`;
            if(myAmmo <= 0) document.getElementById('weapon-ammo').style.color = "red";
            else document.getElementById('weapon-ammo').style.color = "white";
        }

        function reloadWeapon() {
            if (isReloading || myAmmo === MAX_AMMO || myHp <= 0) return;
            isReloading = true; updateWeaponUI();
            if(window.sfx && window.sfx.playReload) window.sfx.playReload();
            gunMesh.rotation.x = -Math.PI / 8; 
            setTimeout(() => {
                myAmmo = MAX_AMMO; isReloading = false;
                if(gunMesh) gunMesh.rotation.x = 0; updateWeaponUI();
            }, 1500);
        }

        function shoot() {
            if(!isPlaying || myHp <= 0 || isReloading) return; 
            if(myAmmo <= 0) { reloadWeapon(); return; }
            
            myAmmo--; updateWeaponUI();
            if(window.sfx && window.sfx.playShoot) window.sfx.playShoot();

            const muzzle = camera.getObjectByName("muzzle");
            const startPos = new THREE.Vector3(); muzzle.getWorldPosition(startPos);
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            let endPos = new THREE.Vector3();
            
            let targets = [...walls];
            for(let id in playersData) {
                if(gameMode === 'bot' && id !== 'bot') continue;
                if(gameMode !== 'bot' && id === 'bot') continue;
                if(gameMode === 'group' && playersData[id].team === myTeam) continue; 
                if(playersData[id].mesh && playersData[id].mesh.visible) targets.push(...playersData[id].mesh.children);
            }

            const intersects = raycaster.intersectObjects(targets, true); 
            let hitPlayerId = null; let dmgAmount = 0; let isHeadshot = false; let dmgColor = 'dmg-limb';

            if (intersects.length > 0) {
                endPos.copy(intersects[0].point);
                let hitMesh = intersects[0].object;
                
                if (hitMesh.name === 'hair' || hitMesh.name === 'nameTag') hitMesh = hitMesh.parent;

                // نظام ألوان الدمج
                if (hitMesh.name === 'head') { dmgAmount = 90; isHeadshot = true; dmgColor = 'dmg-head'; }
                else if (hitMesh.name === 'chest') { dmgAmount = 25; isHeadshot = false; dmgColor = 'dmg-chest'; }
                else if (hitMesh.name === 'limb') { dmgAmount = 10; isHeadshot = false; dmgColor = 'dmg-limb'; }
                else { dmgAmount = 5; isHeadshot = false; dmgColor = 'dmg-limb'; } // للأسلحة وغيرها

                for(let id in playersData) {
                    if(!playersData[id].mesh) continue;
                    let hitBelongsToThis = false;
                    playersData[id].mesh.traverse(c => { if(c === hitMesh) hitBelongsToThis = true; });
                    if(hitBelongsToThis) {
                        hitPlayerId = id;
                        const origColor = hitMesh.material?.color?.getHex();
                        if (hitMesh.material && hitMesh.material.color) hitMesh.material.color.setHex(0xff0000);
                        
                        if(window.sfx) { if(isHeadshot) window.sfx.playHeadshot(); else window.sfx.playHit(); }
                        setTimeout(() => { if(hitMesh.material && hitMesh.material.color && origColor) hitMesh.material.color.setHex(origColor); }, 200);
                        
                        showFloatingDamage(dmgAmount, endPos, dmgColor);
                        break;
                    }
                }
            } else raycaster.ray.at(50, endPos);

            drawBullet(startPos, endPos); 

            push(actionsRef, { type: 'BULLET_FIRED', start: {x:startPos.x,y:startPos.y,z:startPos.z}, end: {x:endPos.x,y:endPos.y,z:endPos.z}, sender: myId });
            if(hitPlayerId && hitPlayerId !== 'bot') {
                push(actionsRef, { type: 'HIT', victim: hitPlayerId, damage: dmgAmount, headshot: isHeadshot, color: dmgColor, sender: myId });
            } 
            else if (hitPlayerId === 'bot' && playersData['bot'].hp > 0) {
                playersData['bot'].hp -= dmgAmount;
                if (playersData['bot'].hp <= 0) {
                    addKillFeedMsg(myProfile.name, 'روبوت', isHeadshot);
                    playersData['bot'].mesh.visible = false; 
                    if(isHost) { aliveB--; checkRoundEnd(); }
                }
            }
        }

        function drawBullet(start, end) {
            const b = new THREE.Line(new THREE.BufferGeometry().setFromPoints([start, end]), new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 2 }));
            scene.add(b); setTimeout(() => { scene.remove(b); }, 40);
        }

        function showFloatingDamage(amount, pos3D, colorClass) {
            const vec = new THREE.Vector3(pos3D.x, pos3D.y, pos3D.z).project(camera);
            const x = (vec.x * 0.5 + 0.5) * window.innerWidth; const y = (vec.y * -0.5 + 0.5) * window.innerHeight;
            const dmgDiv = document.createElement('div');
            dmgDiv.className = 'dmg-text ' + colorClass;
            dmgDiv.innerText = `-${amount}`;
            dmgDiv.style.left = `${x}px`; dmgDiv.style.top = `${y}px`;
            document.body.appendChild(dmgDiv);
            setTimeout(() => { if(document.body.contains(dmgDiv)) document.body.removeChild(dmgDiv); }, 800);
        }

        function updateHUD() {
            const hpPercent = Math.max(0, (myHp / MAX_HP) * 100);
            document.getElementById('hp-fill').style.width = hpPercent + '%';
            document.getElementById('hp-fill').style.backgroundColor = myHp <= 50 ? '#ff0000' : '#ffffff';
            document.getElementById('hp-text-display').innerText = `${Math.floor(myHp)} / ${MAX_HP}`;
            document.getElementById('round-num').innerText = currentRound;
            document.getElementById('score-a-val').innerText = teamScoreA;
            document.getElementById('score-b-val').innerText = teamScoreB;
        }

        function handleDeath() {
            isHealing = false; document.getElementById('heal-progress-container').style.display = 'none';
            gunMesh.visible = false;
            myHp = 0; // لضمان الإخفاء من الأعداء
            update(myPlayerRef, { hp: 0 });
            isScoped = false; camera.fov = 70; camera.updateProjectionMatrix();
        }

        function setupControls() {
            const leftZone = document.getElementById('left-touch-zone');
            const rightZone = document.getElementById('right-touch-zone');
            const pad = document.getElementById('joystick-pad');
            const knob = document.getElementById('joystick-knob');

            leftZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (joyTouchId === null && myHp > 0) { // منع الحركة عند الموت
                    const t = e.changedTouches[0]; joyTouchId = t.identifier;
                    joyOrigin.x = t.clientX; joyOrigin.y = t.clientY;
                    pad.style.left = t.clientX + 'px'; pad.style.top = t.clientY + 'px';
                    pad.style.display = 'block'; moveX = 0; moveZ = 0;
                }
            });
            leftZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joyTouchId) {
                        const t = e.changedTouches[i];
                        let dx = t.clientX - joyOrigin.x; let dy = t.clientY - joyOrigin.y;
                        const maxR = 40; const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
                        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                        moveX = dx / maxR; moveZ = dy / maxR; 
                    }
                }
            });
            const resetJoy = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joyTouchId) {
                        joyTouchId = null; pad.style.display = 'none';
                        knob.style.transform = `translate(-50%, -50%)`; moveX = 0; moveZ = 0;
                    }
                }
            };
            leftZone.addEventListener('touchend', resetJoy); leftZone.addEventListener('touchcancel', resetJoy);

            rightZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (lookTouchId === null) { 
                    isAiming = true;
                    lookTouchId = e.changedTouches[0].identifier; lastLookX = e.changedTouches[0].clientX; lastLookY = e.changedTouches[0].clientY; 
                }
            });
            rightZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === lookTouchId) {
                        const t = e.changedTouches[i];
                        // حساسية الكاميرا تقل مع السكوب
                        let sens = isScoped ? 0.001 : 0.005;
                        yaw -= (t.clientX - lastLookX) * sens; pitch -= (t.clientY - lastLookY) * sens;
                        pitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, pitch)); 
                        camera.rotation.set(pitch, yaw, 0); lastLookX = t.clientX; lastLookY = t.clientY;
                    }
                }
            });
            rightZone.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) { 
                    if (e.changedTouches[i].identifier === lookTouchId) { lookTouchId = null; isAiming = false; }
                }
            });

            // زر السكوب الجديد x5
            document.getElementById('btn-scope').addEventListener('touchstart', (e) => {
                e.preventDefault(); 
                if(!isPlaying || myHp <= 0) return;
                isScoped = !isScoped;
                camera.fov = isScoped ? 14 : 70; // 70 تقسيم 5 = 14
                camera.updateProjectionMatrix();
                if(window.sfx && window.sfx.playReload) window.sfx.playReload();
            });

            document.getElementById('btn-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
            document.getElementById('weapon-ui').addEventListener('touchstart', (e) => { e.preventDefault(); reloadWeapon(); });
            
            document.getElementById('btn-gloo').addEventListener('touchstart', (e) => {
                e.preventDefault(); 
                if (!isPlaying || myHp <= 0 || glooCount <= 0 || isGlooReloading) return;
                glooCount--; updateGlooUI();
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); dir.y = 0; dir.normalize();
                const pos = camera.position.clone().add(dir.multiplyScalar(8)); pos.y = 4; 
                placeGlooWallLocally(pos, yaw);
                push(actionsRef, { type: 'GLOO_WALL', pos: {x: pos.x, y: pos.y, z: pos.z}, rot: yaw, sender: myId });

                if (glooCount === 0) {
                    isGlooReloading = true; updateGlooUI();
                    setTimeout(() => {
                        glooCount = MAX_GLOO; isGlooReloading = false; updateGlooUI();
                        if(window.sfx && window.sfx.playReload) window.sfx.playReload();
                    }, 10000);
                }
            });

            document.getElementById('btn-heal').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isPlaying && myHp > 0 && myHp < MAX_HP && moveX === 0 && moveZ === 0) {
                    isHealing = true; healTime = 0; document.getElementById('heal-progress-container').style.display = 'block';
                }
            });
        }

        function updateMinimap() {
            if (!isPlaying) return;
            const canvas = document.getElementById('minimap');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 120, 120);

            if(myHp > 0) {
                ctx.fillStyle = '#00ff00'; ctx.beginPath(); ctx.arc(60, 60, 4, 0, Math.PI*2); ctx.fill();
                const dirX = -Math.sin(yaw) * 8; const dirZ = -Math.cos(yaw) * 8;
                ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(60, 60); ctx.lineTo(60 + dirX, 60 + dirZ); ctx.stroke();
            }

            for(let id in playersData) {
                const p = playersData[id];
                if (!p.mesh || !p.mesh.visible || p.hp <= 0) continue;
                let isEnemy = (gameMode === 'group' && p.team !== myTeam) || (gameMode !== 'group');
                if (isEnemy && (performance.now() - p.lastShot > 2000)) continue;

                const dx = p.mesh.position.x - camera.position.x; const dz = p.mesh.position.z - camera.position.z;
                const mx = 60 + (dx * 0.3); const mz = 60 + (dz * 0.3); // خريطة أوسع للميني ماب
                
                if (mx > 5 && mx < 115 && mz > 5 && mz < 115) {
                    ctx.fillStyle = isEnemy ? '#ff0000' : '#00aaff';
                    ctx.beginPath(); ctx.arc(mx, mz, 3, 0, Math.PI*2); ctx.fill();
                }
            }
        }

        function animateCharacter(mesh, isMoving, time) {
            if(!mesh) return;
            const swing = isMoving ? Math.sin(time * 0.015) * 0.6 : 0;
            if(mesh.getObjectByName("limb_pivot")) {
                let limbs = [];
                mesh.traverse(c => { if(c.name === "limb_pivot") limbs.push(c); });
                if(limbs.length >= 4) {
                    limbs[0].rotation.x = -Math.PI/2.5 + swing*0.2; // يد
                    limbs[1].rotation.x = -Math.PI/2.5 - swing*0.2; // يد
                    limbs[2].rotation.x = -swing; // رجل
                    limbs[3].rotation.x = swing; // رجل
                }
            }
            const tag = mesh.getObjectByName("nameTag");
            if (tag) { tag.visible = inLobby; tag.quaternion.copy(camera.quaternion); }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now(); const delta = Math.min((time - prevTime) / 1000, 0.1); prevTime = time;

            if (isPlaying && myHp > 0) {
                if (isHealing) {
                    if (moveX !== 0 || moveZ !== 0) {
                        isHealing = false; document.getElementById('heal-progress-container').style.display = 'none'; showFloatingDamage('إلغاء', camera.position, 'dmg-limb');
                    } else {
                        healTime += delta; document.getElementById('heal-progress-fill').style.width = (healTime / HEAL_DURATION) * 100 + '%';
                        if (healTime >= HEAL_DURATION) {
                            isHealing = false; document.getElementById('heal-progress-container').style.display = 'none';
                            myHp = Math.min(MAX_HP, myHp + 75); updateHUD(); showFloatingDamage('+75', camera.position, 'dmg-limb');
                            update(myPlayerRef, { hp: myHp }); 
                            if(window.sfx && window.sfx.playHeal) window.sfx.playHeal();
                        }
                    }
                }

                let isMoving = false;
                if (moveX !== 0 || moveZ !== 0) {
                    isMoving = true;
                    // سرعة أبطأ قليلا عند السكوب
                    const moveSpeed = (isScoped ? 8 : 16) * delta; 
                    
                    const fwd = new THREE.Vector3(0, 0, moveZ); 
                    const right = new THREE.Vector3(moveX, 0, 0); 
                    const dir = new THREE.Vector3().addVectors(fwd, right);
                    dir.applyQuaternion(camera.quaternion); dir.y = 0;
                    
                    if (dir.lengthSq() > 0) {
                        dir.normalize();
                        const speedMulti = Math.min(1, Math.sqrt(moveX*moveX + moveZ*moveZ));

                        const dirX = new THREE.Vector3(dir.x, 0, 0).normalize();
                        if (new THREE.Raycaster(camera.position, dirX, 0, 2.5).intersectObjects(walls, true).length === 0) {
                            camera.position.x += dir.x * moveSpeed * speedMulti;
                        }
                            
                        const dirZ = new THREE.Vector3(0, 0, dir.z).normalize();
                        if (new THREE.Raycaster(camera.position, dirZ, 0, 2.5).intersectObjects(walls, true).length === 0) {
                            camera.position.z += dir.z * moveSpeed * speedMulti;
                        }

                        // صعود السلالم (الجاذبية والمنحدرات)
                        const downRay = new THREE.Raycaster(camera.position, new THREE.Vector3(0, -1, 0), 0, 15);
                        const floorHits = downRay.intersectObjects(walls, true);
                        if (floorHits.length > 0) {
                            let targetY = floorHits[0].point.y + 8; // طول اللاعب
                            camera.position.y += (targetY - camera.position.y) * 0.2; // صعود ونزول ناعم
                        }
                    }
                }

                if (isAiming) {
                    let bestEnemyPos = null;
                    let minAngle = isScoped ? 0.05 : 0.12; 
                    let camDir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
                    
                    let checkTargets = [];
                    if (gameMode === 'bot' && playersData['bot'].hp > 0 && playersData['bot'].mesh.visible) {
                        checkTargets.push(playersData['bot'].mesh.position.clone().setY(5)); 
                    } else if (gameMode !== 'bot') {
                        for(let id in playersData) {
                            if(id === 'bot' || id === myId) continue;
                            let p = playersData[id];
                            if(p.hp > 0 && p.mesh && p.mesh.visible && (gameMode !== 'group' || p.team !== myTeam)) {
                                checkTargets.push(p.mesh.position.clone().setY(5));
                            }
                        }
                    }

                    for(let targetPos of checkTargets) {
                        let dirToEnemy = targetPos.clone().sub(camera.position).normalize();
                        let angle = camDir.angleTo(dirToEnemy);
                        if (angle < minAngle) {
                            let sightRay = new THREE.Raycaster(camera.position, dirToEnemy, 0, camera.position.distanceTo(targetPos));
                            if(sightRay.intersectObjects(walls, true).length === 0) {
                                minAngle = angle;
                                bestEnemyPos = targetPos;
                            }
                        }
                    }

                    if (bestEnemyPos) {
                        let dummyCam = camera.clone(); dummyCam.lookAt(bestEnemyPos); let targetEuler = dummyCam.rotation;
                        let diffYaw = targetEuler.y - yaw;
                        while(diffYaw < -Math.PI) diffYaw += Math.PI*2; while(diffYaw > Math.PI) diffYaw -= Math.PI*2;
                        yaw += diffYaw * (isScoped ? 0.04 : 0.08); 
                        
                        let diffPitch = targetEuler.x - pitch; pitch += diffPitch * (isScoped ? 0.04 : 0.08); pitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, pitch));
                        camera.rotation.set(pitch, yaw, 0);
                    }
                }

                if (time - lastNetworkUpdate > 50) {
                    update(myPlayerRef, { pos: { x: camera.position.x, y: camera.position.y - 8, z: camera.position.z }, rot: yaw, isMoving: isMoving });
                    lastNetworkUpdate = time;
                }

            } else if (isPlaying && myHp <= 0) {
                // نظام Spectator
                let spectateTarget = null;
                if (gameMode === 'group') {
                    for(let id in playersData) {
                        if (playersData[id].team === myTeam && playersData[id].hp > 0 && playersData[id].mesh) {
                            spectateTarget = playersData[id]; break;
                        }
                    }
                }
                
                if (spectateTarget) {
                    const targetPos = spectateTarget.mesh.position.clone().setY(8);
                    const offset = new THREE.Vector3(0, 5, 15).applyAxisAngle(new THREE.Vector3(0,1,0), spectateTarget.mesh.rotation.y);
                    camera.position.lerp(targetPos.clone().add(offset), 0.1);
                    camera.lookAt(targetPos);
                    document.getElementById('hp-text-display').innerText = `تشاهد: ${spectateTarget.profile.name} (${Math.floor(spectateTarget.hp)})`;
                    document.getElementById('hp-fill').style.width = (Math.max(0, spectateTarget.hp) / MAX_HP) * 100 + '%';
                }
            } else if (inLobby) {
                camera.position.set(0, 5, -3); camera.lookAt(0, 4, -15);
                if(myLobbyMesh) animateCharacter(myLobbyMesh, false, time);
            }

            if (isPlaying && gameMode === 'bot' && isHost && playersData['bot'].hp > 0) {
                const bot = playersData['bot']; const botPos = bot.mesh.position; const headPos = botPos.clone().setY(6);
                
                let targetPos = null; let minDist = Infinity;
                if(myHp > 0) { targetPos = camera.position; minDist = headPos.distanceTo(camera.position); }
                for(let id in playersData) {
                    if (id !== 'bot' && id !== myId && playersData[id].team === 'A' && playersData[id].hp > 0 && playersData[id].mesh) {
                        let d = headPos.distanceTo(playersData[id].mesh.position);
                        if(d < minDist) { minDist = d; targetPos = playersData[id].mesh.position; }
                    }
                }

                if (targetPos && minDist < 70) {
                    const dirToPlayer = targetPos.clone().sub(headPos).normalize();
                    if (new THREE.Raycaster(headPos, dirToPlayer, 0, minDist).intersectObjects(walls, true).length === 0) {
                        bot.mesh.lookAt(targetPos.x, botPos.y, targetPos.z);
                        
                        if(!bot.strafeDir) bot.strafeDir = 1;
                        if(Math.random() < 0.02) bot.strafeDir *= -1; 
                        
                        const fwdV = dirToPlayer.clone().setY(0).normalize();
                        const rightV = new THREE.Vector3(-fwdV.z, 0, fwdV.x).multiplyScalar(bot.strafeDir * 0.8);
                        let moveDir = new THREE.Vector3();
                        
                        if (minDist > 20) moveDir.add(fwdV); 
                        else if (minDist < 10) moveDir.sub(fwdV); 
                        moveDir.add(rightV).normalize(); 
                        
                        let isBotMoving = false;
                        if (new THREE.Raycaster(headPos, moveDir, 0, 3).intersectObjects(walls, true).length === 0) {
                            botPos.add(moveDir.multiplyScalar(8 * delta)); // سرعة البوت أبطأ بكثير (8)
                            isBotMoving = true;
                        }
                        
                        // صعود السلالم للبوت
                        const downRay = new THREE.Raycaster(botPos.clone().setY(botPos.y+5), new THREE.Vector3(0, -1, 0), 0, 15);
                        const floorHits = downRay.intersectObjects(walls, true);
                        if (floorHits.length > 0) {
                            botPos.y += (floorHits[0].point.y - botPos.y) * 0.2; 
                        }

                        if(time - bot.lastMoveUpdate > 50 || !bot.lastMoveUpdate) {
                            update(ref(db, 'rooms/' + currentRoomId + '/players/bot'), { pos: {x: botPos.x, y: botPos.y, z: botPos.z}, rot: bot.mesh.rotation.y, isMoving: isBotMoving });
                            bot.lastMoveUpdate = time;
                        }

                        // تأخير الروبوت عند الضرب ليكون اللعب ضده عادلاً (1.5 ثانية)
                        if (!bot.lastShoot || time - bot.lastShoot > 1500) { 
                            bot.lastShoot = time; 
                            push(actionsRef, { type: 'BULLET_FIRED', start: {x:botPos.x, y:4, z:botPos.z}, end: {x:targetPos.x, y:targetPos.y, z:targetPos.z}, sender: 'bot' });
                            
                            let victimId = null;
                            if(targetPos === camera.position) victimId = myId;
                            else {
                                for(let id in playersData) { if(playersData[id].mesh && playersData[id].mesh.position === targetPos) victimId = id; }
                            }
                            if(victimId) push(actionsRef, { type: 'HIT', victim: victimId, damage: 15, headshot: false, sender: 'bot' });
                        }
                    }
                }
            }

            updateMinimap();
            for(let id in playersData) if (playersData[id].mesh && id !== 'bot') animateCharacter(playersData[id].mesh, false, time);
            renderer.render(scene, camera);
        }

        initFirebaseNetwork(); init3D();
    </script>
</body>
</html>
