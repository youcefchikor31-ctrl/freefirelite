<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro FPS - Lobby & Killfeed</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; color: white; touch-action: none; user-select: none;}
        
        /* إجبار الشاشة بالعرض */
        #orientation-lock { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-size: 24px; color: #ffcc00; }
        @media screen and (orientation: landscape) { #orientation-lock { display: none; } }

        /* اللوبي */
        #lobby-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }
        .panel { background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; border: 1px solid #00aaff; pointer-events: auto; backdrop-filter: blur(5px); }
        
        .left-panel { position: absolute; left: 20px; top: 20px; width: 260px; display: flex; flex-direction: column; gap: 10px;}
        .left-panel input[type="text"] { width: 90%; padding: 8px; background: #222; color: #fff; border: 1px solid #00aaff; text-align: center; font-weight: bold;}
        .color-picker { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .color-picker input[type="color"] { cursor: pointer; border: none; width: 40px; height: 30px; background: none; }
        
        .join-box { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; border-top: 1px solid #555; padding-top: 10px;}
        .btn { background: rgba(0, 100, 255, 0.7); border: 2px solid #00aaff; color: white; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.2s;}
        .btn:active { background: #00aaff; transform: scale(0.95);}

        .host-controls { position: absolute; right: 20px; top: 20px; width: 220px; }
        .mode-select { width: 100%; padding: 5px; margin-bottom: 10px; background: #333; color: white; }
        .player-list { max-height: 120px; overflow-y: auto; margin-bottom: 10px; font-size: 14px; }
        .player-item { display: flex; justify-content: space-between; margin-bottom: 5px; padding: 5px; background: rgba(0,0,0,0.5); border-radius: 4px;}
        .team-btn { font-size: 12px; padding: 2px 5px; }
        .team-a { background: #0044aa; border-color: #0066ff;} .team-b { background: #aa0000; border-color: #ff3333;}
        #btn-start { width: 100%; background: #ffaa00; color: #000; border: none; font-size: 18px; padding: 10px; font-weight: bold; border-radius: 5px;}

        /* واجهة اللعب */
        #game-ui { display: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none;}
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #ffaa00; border-radius: 50%; transform: translate(-50%, -50%); }
        .hud { position: absolute; color: white; font-size: 16px; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 10; pointer-events: none; }
        #score-board { top: 10px; left: 10px; }
        #hp-board { top: 10px; right: 10px; color: #00ff00; font-size: 20px;}
        #msg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; font-size: 30px; z-index: 20; color: #ffaa00; pointer-events: auto; text-align: center;}
        
        .btn-game { position: absolute; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255,255,255,0.3); color: white; font-weight: bold; display: flex; justify-content: center; align-items: center; border-radius: 50%; pointer-events: auto; font-size: 18px; z-index: 15;}
        .btn-game:active { background: rgba(255, 255, 255, 0.4); }
        #btn-fwd { bottom: 100px; left: 30px; width: 60px; height: 60px; }
        #btn-bwd { bottom: 20px; left: 30px; width: 60px; height: 60px; }
        #btn-shoot { bottom: 30px; right: 30px; width: 80px; height: 80px; background: rgba(255, 170, 0, 0.2); border-color: #ffaa00; }
        #touch-look-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; z-index: 1; }

        .dmg-text { position: absolute; color: #ffaa00; font-weight: bold; font-size: 22px; text-shadow: 2px 2px 0 #000; pointer-events: none; animation: floatUp 0.8s forwards; z-index: 50; }
        .dmg-headshot { color: #ff0000; font-size: 28px; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-50px) scale(1.5); opacity: 0; } }

        /* شريط القتل (Kill Feed) */
        #kill-feed { position: absolute; bottom: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none; z-index: 50; }
        .kill-msg { background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 5px; color: white; font-weight: bold; border: 1px solid #444; animation: fadeOut 4s forwards; font-size: 14px;}
        .kill-msg .killer { color: #00aaff; }
        .kill-msg .victim { color: #ff4444; }
        .kill-msg .hs { color: #ffaa00; margin-right: 5px; font-size: 1.1em; }
        @keyframes fadeOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; display: none; } }
    </style>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
</head>
<body>

    <div id="orientation-lock">⚠️<br>يرجى تدوير الهاتف بالعرض للعب!</div>

    <div id="lobby-ui">
        <div class="panel left-panel">
            <h3 style="margin: 0; color: #00aaff; text-align: center;">شخصيتي</h3>
            <input type="text" id="my-name" value="مقاتل" placeholder="اسمك">
            
            <div class="color-picker">القميص: <input type="color" id="c-shirt" value="#0055ff"></div>
            <div class="color-picker">السروال: <input type="color" id="c-pants" value="#222222"></div>
            <div class="color-picker">الشعر: <input type="color" id="c-hair" value="#ffaa00"></div>
            
            <div class="join-box" id="join-section">
                <small style="color:#aaa;">للانضمام لغرفة صديق:</small>
                <input type="text" id="friend-id" placeholder="كود الغرفة">
                <button class="btn" id="btn-join">انضمام ➔</button>
            </div>
            <div style="font-size: 12px; color: #ffaa00; text-align: center; margin-top: 5px;">
                كود غرفتك: <br><span id="my-id-display" style="font-size: 16px; user-select: all;">جارِ الاتصال...</span>
            </div>
        </div>

        <div class="panel host-controls" id="host-panel">
            <h3 style="margin-top:0; color:#ffaa00; text-align: center;">المباراة</h3>
            <select class="mode-select" id="mode-select">
                <option value="bot">تدريب ضد الروبوت</option>
                <option value="1v1">1 ضد 1</option>
                <option value="group">مجموعة (فرق)</option>
            </select>
            <div class="player-list" id="player-list"></div>
            <button id="btn-start">بدء المعركة 🔥</button>
        </div>
    </div>

    <div id="game-ui">
        <div id="msg-overlay"></div>
        <div id="touch-look-zone"></div>
        <div id="score-board" class="hud">فريقي: <span id="team-score">0</span> | الخصم: <span id="enemy-score">0</span></div>
        <div id="hp-board" class="hud">HP: <span id="my-hp">100</span></div>
        <div id="crosshair"></div>
        
        <div id="btn-fwd" class="btn-game">أمام</div>
        <div id="btn-bwd" class="btn-game">خلف</div>
        <div id="btn-shoot" class="btn-game">نار</div>
        
        <div id="kill-feed"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        let peer, myId, isHost = true;
        let connections = {}; 
        
        let myProfile = { name: 'مقاتل', shirt: '#0055ff', pants: '#222222', hair: '#ffaa00' };
        let playersData = {}; 
        let myTeam = 'A', gameMode = 'bot';

        let camera, scene, renderer, walls = [], lobbyEnv = new THREE.Group();
        let raycaster;
        let isPlaying = false, inLobby = true;
        let isMovingFwd = false, isMovingBwd = false;
        let pitch = 0, yaw = 0, lookTouchId = null, lastLookX = 0, lastLookY = 0;
        let prevTime = performance.now(), teamScoreA = 0, teamScoreB = 0;
        let myHp = 100;

        let myLobbyMesh = null, gunMesh = null;

        // --- الشبكة والاتصال ---
        function initNetwork() {
            myId = 'fps_' + Math.random().toString(36).substr(2, 5);
            peer = new Peer(myId);
            peer.on('open', (id) => { document.getElementById('my-id-display').innerText = id; });

            peer.on('connection', (conn) => {
                isHost = true; connections[conn.peer] = conn; setupConnectionEvents(conn);
                playersData[conn.peer] = { team: 'B', hp: 100, profile: { name: 'ضيف', shirt: '#fff', pants: '#fff', hair: '#fff' }, mesh: null };
                updateLobbyUI();
            });

            document.getElementById('btn-join').addEventListener('click', () => {
                const friendId = document.getElementById('friend-id').value;
                if(friendId) {
                    isHost = false;
                    document.getElementById('host-panel').style.display = 'none';
                    document.getElementById('join-section').style.display = 'none';
                    let conn = peer.connect(friendId);
                    connections[friendId] = conn;
                    setupConnectionEvents(conn);
                }
            });

            document.getElementById('btn-start').addEventListener('click', () => {
                gameMode = document.getElementById('mode-select').value;
                startMatch();
            });

            const updateMyProfile = () => {
                myProfile.name = document.getElementById('my-name').value || 'مقاتل';
                myProfile.shirt = document.getElementById('c-shirt').value;
                myProfile.pants = document.getElementById('c-pants').value;
                myProfile.hair = document.getElementById('c-hair').value;
                applyProfileToMesh(myLobbyMesh, myProfile);
                broadcast({ type: 'PROFILE_UPDATE', profile: myProfile });
            };
            
            document.getElementById('my-name').addEventListener('input', updateMyProfile);
            document.getElementById('c-shirt').addEventListener('input', updateMyProfile);
            document.getElementById('c-pants').addEventListener('input', updateMyProfile);
            document.getElementById('c-hair').addEventListener('input', updateMyProfile);
        }

        function broadcast(data) { for(let id in connections) connections[id].send(data); }

        function setupConnectionEvents(conn) {
            conn.on('open', () => { conn.send({ type: 'PROFILE_UPDATE', profile: myProfile }); });

            conn.on('data', (data) => {
                if (data.type === 'PROFILE_UPDATE') {
                    if (!playersData[conn.peer]) playersData[conn.peer] = { team: 'B', hp: 100 };
                    playersData[conn.peer].profile = data.profile;
                    if (!playersData[conn.peer].mesh) {
                        playersData[conn.peer].mesh = createMinecraftCharacter(data.profile);
                        scene.add(playersData[conn.peer].mesh);
                    } else applyProfileToMesh(playersData[conn.peer].mesh, data.profile);
                    organizeLobbyPositions(); updateLobbyUI();
                    if (isHost) broadcastLobbyState();
                }
                else if (data.type === 'LOBBY_STATE' && !isHost) syncLobbyState(data.state);
                else if(data.type === 'START_MATCH') {
                    gameMode = data.mode; myTeam = data.myTeam;
                    buildMap(data.map); switchToGameScene(data.spawnIndex);
                }
                else if (data.type === 'MOVE') {
                    if (playersData[conn.peer] && playersData[conn.peer].mesh) {
                        playersData[conn.peer].mesh.position.set(data.pos.x, 0, data.pos.z);
                        playersData[conn.peer].mesh.rotation.y = data.rot;
                        animateCharacter(playersData[conn.peer].mesh, data.isMoving, performance.now());
                    }
                }
                else if (data.type === 'BULLET_FIRED') drawBullet(data.start, data.end);
                
                // استقبال تأكيد الدمج (الضحية تتلقى الدمج وتبلغ بموتها)
                else if (data.type === 'HIT') {
                    myHp -= data.damage; updateHUD();
                    if (myHp <= 0) {
                        broadcast({ type: 'DEATH_EVENT', killerId: conn.peer, victimName: myProfile.name, headshot: data.headshot });
                        addKillFeedMsg(playersData[conn.peer].profile.name, myProfile.name, data.headshot);
                        handleDeath();
                    }
                }
                // استقبال إعلان الموت لجميع اللاعبين ليظهر في شريط القتل
                else if (data.type === 'DEATH_EVENT') {
                    let kName = data.killerId === 'bot' ? 'روبوت' : (playersData[data.killerId]?.profile?.name || 'مجهول');
                    if (data.killerId === myId) kName = myProfile.name;
                    addKillFeedMsg(kName, data.victimName, data.headshot);
                }
            });
        }

        function broadcastLobbyState() {
            let state = {};
            for(let id in playersData) if (id !== 'bot') state[id] = { team: playersData[id].team, profile: playersData[id].profile };
            state[myId] = { team: myTeam, profile: myProfile };
            broadcast({ type: 'LOBBY_STATE', state: state });
        }

        function syncLobbyState(state) {
            for(let id in state) {
                if (id === myId) { myTeam = state[id].team; continue; }
                if (!playersData[id]) playersData[id] = { hp: 100, mesh: createMinecraftCharacter(state[id].profile) };
                playersData[id].team = state[id].team; playersData[id].profile = state[id].profile;
                applyProfileToMesh(playersData[id].mesh, state[id].profile);
                if (!playersData[id].mesh.parent) scene.add(playersData[id].mesh);
            }
            organizeLobbyPositions();
        }

        function updateLobbyUI() {
            if (!isHost) return;
            const list = document.getElementById('player-list');
            list.innerHTML = `<div class="player-item">أنت (المضيف) <button class="btn team-btn ${myTeam==='A'?'team-a':'team-b'}" onclick="toggleMyTeam()">فريق ${myTeam}</button></div>`;
            for (let id in connections) {
                if(!playersData[id]) continue;
                const p = playersData[id];
                list.innerHTML += `<div class="player-item">${p.profile.name} <button class="btn team-btn ${p.team === 'A' ? 'team-a' : 'team-b'}" onclick="toggleTeam('${id}')">فريق ${p.team}</button></div>`;
            }
            broadcastLobbyState();
        }
        window.toggleTeam = function(id) { if(playersData[id]) { playersData[id].team = playersData[id].team === 'A' ? 'B' : 'A'; updateLobbyUI(); } };
        window.toggleMyTeam = function() { myTeam = myTeam === 'A' ? 'B' : 'A'; updateLobbyUI(); };

        function organizeLobbyPositions() {
            if(myLobbyMesh) { myLobbyMesh.position.set(0, 0, -15); myLobbyMesh.rotation.y = 0; }
            let offset = 4, side = 1;
            for(let id in playersData) {
                if(id === 'bot' || !playersData[id].mesh) continue;
                playersData[id].mesh.position.set(offset * side, 0, -15);
                playersData[id].mesh.rotation.y = 0;
                side = (side === 1) ? -1 : 1;
                if(side === 1) offset += 4;
            }
        }

        // --- محرك اللعبة والتصميم ---
        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';
            scene.add(camera);
            scene.add(new THREE.AmbientLight(0xffffff, 0.9));

            // إنشاء بيئة اللوبي (سماء، غيوم، أرضية خضراء)
            scene.background = new THREE.Color(0x87CEEB); // لون السماء النهاري
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);
            
            const grass = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshBasicMaterial({color: 0x228B22}));
            grass.rotation.x = -Math.PI/2;
            lobbyEnv.add(grass);
            
            // غيوم عشوائية
            const cloudGeo = new THREE.SphereGeometry(4, 7, 7);
            const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            for(let i=0; i<15; i++) {
                const cloud = new THREE.Mesh(cloudGeo, cloudMat);
                cloud.position.set((Math.random() - 0.5) * 100, 25 + Math.random() * 10, -30 - Math.random() * 50);
                cloud.scale.set(1 + Math.random()*2, 0.5 + Math.random(), 1 + Math.random()*2);
                lobbyEnv.add(cloud);
            }
            scene.add(lobbyEnv);

            camera.position.set(0, 8, 2); 
            
            // السلاح بالكاميرا (للمباراة)
            gunMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 1.5), new THREE.MeshBasicMaterial({ color: 0x222222 }));
            gunMesh.position.set(0.8, -0.8, -1.5);
            camera.add(gunMesh);
            const muzzle = new THREE.Object3D(); muzzle.position.set(0, 0, -0.8); muzzle.name = "muzzle";
            gunMesh.add(muzzle);
            gunMesh.visible = false;

            myLobbyMesh = createMinecraftCharacter(myProfile);
            scene.add(myLobbyMesh);
            organizeLobbyPositions();

            playersData['bot'] = { team: 'B', hp: 100, profile: {name: 'روبوت', shirt: '#ff0000', pants: '#111', hair: '#555'}, mesh: createMinecraftCharacter({name: 'روبوت', shirt: '#ff0000', pants: '#111', hair: '#555'}) };
            playersData['bot'].mesh.position.set(0, -100, 0); 
            scene.add(playersData['bot'].mesh);

            raycaster = new THREE.Raycaster();
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            setupControls(); animate();
        }

        function createNameSprite(name) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 10, 256, 44);
            ctx.font = 'bold 30px sans-serif'; ctx.fillStyle = '#ffaa00';
            ctx.textAlign = 'center'; ctx.fillText(name, 128, 42);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
            sprite.scale.set(6, 1.5, 1); sprite.position.y = -0.5; sprite.name = "nameTag";
            return sprite;
        }

        // بناء الشخصية بحيث تحمل سلاح وتتخذ وضعية قتالية
        function createMinecraftCharacter(profile) {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshBasicMaterial({ color: 0xffccaa }); 
            const shirtMat = new THREE.MeshBasicMaterial({ color: profile.shirt }); 
            const pantsMat = new THREE.MeshBasicMaterial({ color: profile.pants }); 
            const hairMat = new THREE.MeshBasicMaterial({ color: profile.hair }); 
            
            const createPart = (geo, mat, name, yPos, parentY = 0) => {
                const mesh = new THREE.Mesh(geo, mat.clone()); 
                mesh.name = name; mesh.position.y = yPos;
                const pivot = new THREE.Group(); pivot.position.y = parentY;
                pivot.add(mesh); pivot.name = name + "_pivot";
                group.add(pivot); return pivot;
            };

            const headP = createPart(new THREE.BoxGeometry(2, 2, 2), skinMat, "head", 1, 6);
            const hair = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.5, 2.1), hairMat);
            hair.position.y = 2.2; hair.name = "hair"; headP.children[0].add(hair);

            createPart(new THREE.BoxGeometry(0.8, 0.5, 0.8), skinMat, "neck", 0, 5.5);
            createPart(new THREE.BoxGeometry(2, 1.5, 1), shirtMat, "chest", -0.75, 5.5);
            createPart(new THREE.BoxGeometry(2, 1.5, 1), shirtMat, "belly", -2.25, 5.5);
            
            const armL = createPart(new THREE.BoxGeometry(1, 3, 1), skinMat, "armL", -1.5, 5.5); armL.position.x = -1.5;
            const armR = createPart(new THREE.BoxGeometry(1, 3, 1), skinMat, "armR", -1.5, 5.5); armR.position.x = 1.5;
            
            // إضافة بندقية ليد اللاعب اليمنى
            const charGun = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 2), new THREE.MeshBasicMaterial({ color: 0x111 }));
            charGun.position.set(0, -1.5, -1);
            armR.children[0].add(charGun); // إضافتها للمجسم نفسه داخل الـ Pivot

            const legL = createPart(new THREE.BoxGeometry(1, 3, 1), pantsMat, "legL", -1.5, 3); legL.position.x = -0.5;
            const legR = createPart(new THREE.BoxGeometry(1, 3, 1), pantsMat, "legR", -1.5, 3); legR.position.x = 0.5;

            group.add(createNameSprite(profile.name));
            return group;
        }

        function applyProfileToMesh(group, profile) {
            if(!group) return;
            group.getObjectByName("chest").material.color.set(profile.shirt);
            group.getObjectByName("belly").material.color.set(profile.shirt);
            group.getObjectByName("legL").material.color.set(profile.pants);
            group.getObjectByName("legR").material.color.set(profile.pants);
            group.getObjectByName("hair").material.color.set(profile.hair);
            const oldTag = group.getObjectByName("nameTag");
            if(oldTag) group.remove(oldTag); group.add(createNameSprite(profile.name));
        }

        // --- منطق المعركة ---
        function startMatch() {
            const mapArr = generateMap(); buildMap(mapArr); switchToGameScene(0); 
            if (gameMode !== 'bot') {
                let spawnIndex = 1;
                for(let id in connections) connections[id].send({ type: 'START_MATCH', mode: gameMode, map: mapArr, myTeam: playersData[id].team, spawnIndex: spawnIndex++ });
            } else {
                playersData['bot'].mesh.position.set(50, 0, 50); playersData['bot'].hp = 100;
            }
        }

        function generateMap() {
            const arr = [];
            for (let x = -6; x <= 6; x++) {
                for (let z = -6; z <= 6; z++) {
                    if (Math.abs(x) > 4 && Math.abs(z) > 4) continue;
                    if (Math.random() > 0.6) arr.push({ x: x * 10, z: z * 10 });
                }
            } return arr;
        }

        function buildMap(serverWalls) {
            walls.forEach(w => scene.remove(w)); walls = [];
            const wallGeo = new THREE.BoxGeometry(10, 15, 10);
            const wallMat = new THREE.MeshBasicMaterial({ color: 0x223344 });
            const edgeMat = new THREE.LineBasicMaterial({ color: 0x0088ff });
            serverWalls.forEach(pos => {
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.add(new THREE.LineSegments(new THREE.EdgesGeometry(wallGeo), edgeMat));
                wall.position.set(pos.x, 7.5, pos.z); scene.add(wall); walls.push(wall);
            });
            const addB = (x,z, r, w, d) => {
                const m = new THREE.Mesh(new THREE.BoxGeometry(w, 40, d), new THREE.MeshBasicMaterial({ color: 0x001122 }));
                m.position.set(x, 20, z); m.rotation.y = r; scene.add(m); walls.push(m);
            };
            addB(0, -80, 0, 160, 10); addB(0, 80, 0, 160, 10); addB(-80, 0, Math.PI/2, 160, 10); addB(80, 0, Math.PI/2, 160, 10);
            const floor = new THREE.GridHelper(160, 40, 0x00aaff, 0x002244); floor.position.y = 0; scene.add(floor);
        }

        function switchToGameScene(spawnIndex) {
            inLobby = false; isPlaying = true;
            document.getElementById('lobby-ui').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            myHp = 100; updateHUD();
            
            // تغيير البيئة للمباراة المغلقة المظلمة
            lobbyEnv.visible = false;
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.015);

            gunMesh.visible = true; myLobbyMesh.visible = false; 

            const spawns = [{x: -60, z: -60}, {x: 60, z: 60}, {x: -60, z: 60}, {x: 60, z: -60}];
            const idx = spawnIndex % spawns.length;
            camera.position.set(spawns[idx].x, 6, spawns[idx].z);
            yaw = 0; pitch = 0; camera.rotation.set(0,0,0);
        }

        // إشعار القتل (Kill Feed)
        function addKillFeedMsg(killerName, victimName, isHeadshot) {
            const feed = document.getElementById('kill-feed');
            const div = document.createElement('div');
            div.className = 'kill-msg';
            div.innerHTML = `<span class="killer">${killerName}</span> 🔫 <span class="victim">${victimName}</span> ${isHeadshot ? '<span class="hs">🎯 (Headshot)</span>' : ''}`;
            feed.appendChild(div);
            setTimeout(() => { if(feed.contains(div)) feed.removeChild(div); }, 4000);
        }

        function shoot() {
            const muzzle = camera.getObjectByName("muzzle");
            const startPos = new THREE.Vector3(); muzzle.getWorldPosition(startPos);
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            let endPos = new THREE.Vector3();
            
            let targets = [...walls];
            for(let id in playersData) {
                if(gameMode === 'bot' && id !== 'bot') continue;
                if(gameMode !== 'bot' && id === 'bot') continue;
                if(gameMode === 'group' && playersData[id].team === myTeam) continue; 
                if(playersData[id].mesh) targets.push(...playersData[id].mesh.children);
            }

            const intersects = raycaster.intersectObjects(targets, true);
            let hitPlayerId = null; let dmgAmount = 5; let isHeadshot = false;

            if (intersects.length > 0) {
                endPos.copy(intersects[0].point);
                let hitMesh = intersects[0].object;
                
                if (hitMesh.name === 'hair' || hitMesh.name === 'nameTag') hitMesh = hitMesh.parent;

                if (hitMesh.name === 'head') { dmgAmount = 90; isHeadshot = true; }
                else if (hitMesh.name === 'neck') dmgAmount = 50;
                else if (hitMesh.name === 'chest') dmgAmount = 15;
                else if (hitMesh.name === 'belly') dmgAmount = 5;

                for(let id in playersData) {
                    if(!playersData[id].mesh) continue;
                    let hitBelongsToThis = false;
                    playersData[id].mesh.traverse(c => { if(c === hitMesh) hitBelongsToThis = true; });
                    if(hitBelongsToThis) {
                        hitPlayerId = id;
                        const origColor = hitMesh.material.color.getHex();
                        hitMesh.material.color.setHex(0xff0000);
                        setTimeout(() => { if(hitMesh.material) hitMesh.material.color.setHex(origColor); }, 200);
                        showFloatingDamage(dmgAmount, endPos);
                        break;
                    }
                }
            } else {
                raycaster.ray.at(50, endPos);
            }

            drawBullet(startPos, endPos); 

            if (gameMode !== 'bot') {
                for(let id in connections) {
                    connections[id].send({ type: 'BULLET_FIRED', start: startPos, end: endPos });
                    if(hitPlayerId === id) connections[id].send({ type: 'HIT', damage: dmgAmount, headshot: isHeadshot });
                }
            } else if (hitPlayerId === 'bot' && playersData['bot'].hp > 0) {
                playersData['bot'].hp -= dmgAmount;
                if (playersData['bot'].hp <= 0) {
                    addKillFeedMsg(myProfile.name, 'روبوت', isHeadshot);
                    handleWin();
                }
            }
        }

        function drawBullet(start, end) {
            const b = new THREE.Line(new THREE.BufferGeometry().setFromPoints([start, end]), new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 2 }));
            scene.add(b); setTimeout(() => { scene.remove(b); }, 40);
        }

        function showFloatingDamage(amount, pos3D) {
            const vec = pos3D.clone().project(camera);
            const x = (vec.x * 0.5 + 0.5) * window.innerWidth;
            const y = (vec.y * -0.5 + 0.5) * window.innerHeight;
            const dmgDiv = document.createElement('div');
            dmgDiv.className = 'dmg-text' + (amount >= 90 ? ' dmg-headshot' : '');
            dmgDiv.innerText = amount >= 90 ? `90` : `-${amount}`;
            dmgDiv.style.left = `${x}px`; dmgDiv.style.top = `${y}px`;
            document.body.appendChild(dmgDiv);
            setTimeout(() => { if(document.body.contains(dmgDiv)) document.body.removeChild(dmgDiv); }, 800);
        }

        function updateHUD() {
            document.getElementById('my-hp').innerText = myHp;
            document.getElementById('my-hp').style.color = myHp > 40 ? '#00ff00' : '#ff0000';
            document.getElementById('team-score').innerText = teamScoreA;
            document.getElementById('enemy-score').innerText = teamScoreB;
        }

        function handleDeath() {
            isPlaying = false; teamScoreB++;
            const msg = document.getElementById('msg-overlay');
            msg.innerHTML = `💀 تم قتلك! 💀<br><br><button class="btn" style="padding:15px; font-size:20px;" onclick="location.reload()">عودة للوبي</button>`;
            msg.style.display = 'flex';
        }
        function handleWin() {
            isPlaying = false; teamScoreA++;
            const msg = document.getElementById('msg-overlay');
            msg.innerHTML = `🏆 فوز! 🏆<br><br><button class="btn" style="padding:15px; font-size:20px;" onclick="location.reload()">عودة للوبي</button>`;
            msg.style.display = 'flex';
        }

        // --- التحكم والأنيميشن ---
        function setupControls() {
            const touchZone = document.getElementById('touch-look-zone');
            touchZone.addEventListener('touchstart', (e) => {
                if(e.target !== touchZone) return; e.preventDefault();
                if (lookTouchId === null) { lookTouchId = e.changedTouches[0].identifier; lastLookX = e.changedTouches[0].clientX; lastLookY = e.changedTouches[0].clientY; }
            });
            touchZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === lookTouchId) {
                        const t = e.changedTouches[i];
                        yaw -= (t.clientX - lastLookX) * 0.005; pitch -= (t.clientY - lastLookY) * 0.005;
                        pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                        camera.rotation.set(pitch, yaw, 0); lastLookX = t.clientX; lastLookY = t.clientY;
                    }
                }
            });
            touchZone.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) { if (e.changedTouches[i].identifier === lookTouchId) lookTouchId = null; }
            });

            const bindBtn = (id, setMove) => {
                const btn = document.getElementById(id);
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); setMove(true); });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); setMove(false); });
            };
            bindBtn('btn-fwd', v => isMovingFwd = v); bindBtn('btn-bwd', v => isMovingBwd = v);
            document.getElementById('btn-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); if (isPlaying) shoot(); });
        }

        function animateCharacter(mesh, isMoving, time) {
            if(!mesh) return;
            const swing = isMoving ? Math.sin(time * 0.01) * 0.5 : 0;
            
            // رفع الأيدي بشكل دائم لحمل السلاح + تأرجح خفيف للمشي
            if(mesh.getObjectByName("armL_pivot")) mesh.getObjectByName("armL_pivot").rotation.x = -Math.PI/2.5 + swing*0.2;
            if(mesh.getObjectByName("armR_pivot")) mesh.getObjectByName("armR_pivot").rotation.x = -Math.PI/2.5 - swing*0.2;
            
            if(mesh.getObjectByName("legL_pivot")) mesh.getObjectByName("legL_pivot").rotation.x = -swing;
            if(mesh.getObjectByName("legR_pivot")) mesh.getObjectByName("legR_pivot").rotation.x = swing;
            
            // إخفاء الاسم في حالة بدء المباراة، وإظهاره في اللوبي
            const tag = mesh.getObjectByName("nameTag");
            if (tag) {
                tag.visible = inLobby; 
                tag.quaternion.copy(camera.quaternion); // مواجهة الكاميرا
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now(); const delta = Math.min((time - prevTime) / 1000, 0.1); prevTime = time;

            if (isPlaying) {
                if (isMovingFwd || isMovingBwd) {
                    const moveSpeed = 35 * delta;
                    const dir = new THREE.Vector3(0, 0, isMovingFwd ? -1 : 1);
                    dir.applyQuaternion(camera.quaternion); dir.y = 0; dir.normalize();
                    
                    const dirX = new THREE.Vector3(dir.x, 0, 0);
                    if (dirX.lengthSq() > 0.001) {
                        dirX.normalize();
                        if (new THREE.Raycaster(camera.position, dirX, 0, 2.5).intersectObjects(walls).length === 0) camera.position.x += dir.x * moveSpeed;
                    }
                    const dirZ = new THREE.Vector3(0, 0, dir.z);
                    if (dirZ.lengthSq() > 0.001) {
                        dirZ.normalize();
                        if (new THREE.Raycaster(camera.position, dirZ, 0, 2.5).intersectObjects(walls).length === 0) camera.position.z += dir.z * moveSpeed;
                    }
                }

                if (gameMode !== 'bot') {
                    for(let id in connections) connections[id].send({ type: 'MOVE', pos: { x: camera.position.x, y: 0, z: camera.position.z }, rot: yaw, isMoving: (isMovingFwd || isMovingBwd) });
                }

                if (gameMode === 'bot' && playersData['bot'].hp > 0) {
                    const bot = playersData['bot']; const botPos = bot.mesh.position; const headPos = botPos.clone().setY(6);
                    const distToPlayer = headPos.distanceTo(camera.position); const dirToPlayer = camera.position.clone().sub(headPos).normalize();
                    
                    if (new THREE.Raycaster(headPos, dirToPlayer, 0, distToPlayer).intersectObjects(walls).length === 0 && distToPlayer < 70) {
                        bot.mesh.lookAt(camera.position.x, botPos.y, camera.position.z);
                        if (distToPlayer > 20) botPos.add(dirToPlayer.clone().setY(0).normalize().multiplyScalar(15 * delta));
                        animateCharacter(bot.mesh, true, time);
                        
                        if (!bot.lastShoot || time - bot.lastShoot > 800) {
                            bot.lastShoot = time;
                            drawBullet(botPos.clone().setY(4), camera.position);
                            myHp -= 10; updateHUD();
                            if(myHp <= 0) {
                                addKillFeedMsg('روبوت', myProfile.name, false);
                                handleDeath();
                            }
                        }
                    } else animateCharacter(bot.mesh, false, time);
                }

                for(let id in playersData) if (playersData[id].mesh) animateCharacter(playersData[id].mesh, false, time);

            } else if (inLobby) {
                camera.position.x = Math.sin(time * 0.0005) * 8;
                camera.position.z = -2 + Math.cos(time * 0.0005) * 8;
                camera.lookAt(0, 4, -15);
                
                if(myLobbyMesh) animateCharacter(myLobbyMesh, false, time);
                for(let id in playersData) if (playersData[id].mesh && id !== 'bot') animateCharacter(playersData[id].mesh, false, time);
            }

            renderer.render(scene, camera);
        }

        initNetwork(); init3D();
    </script>
</body>
